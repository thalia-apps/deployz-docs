<svg xmlns="http://www.w3.org/2000/svg" width="360" height="711" viewBox="0 0 360 711" role="img" aria-labelledby="title desc">
  <title id="title">How the health check works</title>
  <desc id="desc">How the health check works. In this example, the analysis detected a /health route, so the load balancer sends GET /health to the container on its configured port, 3000, and the application must return HTTP 200 once it&#x27;s ready. If the analysis finds no health route, Deployz checks / instead and accepts any response from 200 to 399. The application must listen on 0.0.0.0, not 127.0.0.1. Common failures: the port doesn&#x27;t match, the server is bound to localhost, or a detected or entered path redirects, returns 404, or needs sign-in. Each new container gets five minutes after it starts before failed health checks count. If the deployment still isn&#x27;t healthy about 30 minutes after the install or deploy finished, Deployz marks it as failed.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. Mobile variant of health-check.svg.
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="360" height="711" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>



    <!-- Icons: Lucide (ISC license), 24 x 24 -->
    <symbol id="i-network" viewBox="0 0 24 24"><rect x="16" y="16" width="6" height="6" rx="1" /><rect x="2" y="16" width="6" height="6" rx="1" /><rect x="9" y="2" width="6" height="6" rx="1" /><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3" /><path d="M12 12V8" /></symbol>
  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="359" height="710" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="358" height="709" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
    <ellipse cx="180.0" cy="110" rx="260" ry="100" fill="url(#light)" />
  </g>
  <g id="request">
    <rect class="tile" x="16" y="32" width="328" height="44" rx="10" filter="url(#shadow)" />
    <rect x="25" y="40" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-network" class="icon" x="32" y="47" width="14" height="14" />
    <text class="title" x="61" y="51">Load balancer</text>
    <text class="mono" x="61" y="67">health check</text>
    <line class="track" x1="110" y1="76" x2="110" y2="144" marker-end="url(#arrow)" />
    <rect x="38.8" y="96" width="142.4" height="20" rx="10" style="fill:#FFFFFF;stroke:#D4D4D8" />
    <text class="mono" x="110" y="110" text-anchor="middle">GET /health :3000</text>
    <line class="beam" x1="250" y1="144" x2="250" y2="78" marker-end="url(#arrow)" />
    <rect x="218.4" y="96" width="63.2" height="20" rx="10" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <text class="mono-brand" x="250" y="110" text-anchor="middle">200 OK</text>
  </g>
  <g id="container">
    <rect class="boundary" x="8" y="158" width="344" height="70" rx="14" style="stroke:#D4D4D8" />
    <rect class="tag" x="24" y="146" width="122" height="24" rx="6" />
    <text class="title" x="36" y="162.5">Your container</text>
    <text class="note" x="24" y="190">Listens on</text>
    <text class="mono-dark" x="92" y="190">0.0.0.0:3000</text>
    <text class="note" x="24" y="210">Returns 200 when it&#x27;s ready</text>
  </g>
  <g id="common-failures">
    <text class="label" x="16" y="254">Common failures</text>
    <rect x="16" y="266" width="328" height="85" rx="12" style="fill:#FEF2F2;stroke:#FECACA" />
    <text class="title" x="30" y="293">Port doesn&#x27;t match</text>
    <text class="note" x="30" y="312">The Port setting must match the port your</text>
    <text class="note" x="30" y="328">application listens on.</text>
    <rect x="16" y="361" width="328" height="85" rx="12" style="fill:#FEF2F2;stroke:#FECACA" />
    <text class="title" x="30" y="388">Bound to localhost</text>
    <text class="note" x="30" y="407">A server on 127.0.0.1 never receives load</text>
    <text class="note" x="30" y="423">balancer requests.</text>
    <rect x="16" y="456" width="328" height="85" rx="12" style="fill:#FEF2F2;stroke:#FECACA" />
    <text class="title" x="30" y="483">Wrong response</text>
    <text class="note" x="30" y="502">A redirect, a 404, or a sign-in page fails a</text>
    <text class="note" x="30" y="518">detected or entered path.</text>
  </g>
  <g id="timing">
    <text class="label" x="24" y="561">Timing: 5 minutes of grace for each new container,</text>
    <text class="label" x="24" y="577">then about 30 minutes after an install or deploy</text>
    <rect x="24" y="595" width="87.36" height="10" rx="5" style="fill:#E4E4E7" />
    <rect x="113.36" y="595" width="185.2" height="10" rx="5" style="fill:#BFDBFE" />
    <rect x="300.56" y="595" width="35.44" height="10" rx="5" style="fill:#FECACA" />
    <rect x="24" y="616" width="18" height="10" rx="5" style="fill:#E4E4E7" />
    <text class="mono-dark" x="52" y="625">0 to 5 min</text>
    <text class="note" x="152" y="625">Checks don&#x27;t count yet</text>
    <rect x="24" y="638" width="18" height="10" rx="5" style="fill:#BFDBFE" />
    <text class="mono-dark" x="52" y="647">after 5 min</text>
    <text class="note" x="152" y="647">Checks count</text>
    <rect x="24" y="660" width="18" height="10" rx="5" style="fill:#FECACA" />
    <text class="mono-dark" x="52" y="669">about 30 min</text>
    <text class="note" x="152" y="669">Marked failed if still not healthy</text>
  </g>
</svg>
