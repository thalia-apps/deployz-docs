<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1290" viewBox="0 0 360 1290" role="img" aria-labelledby="title desc">
  <title id="title">Deployz access in your AWS account</title>
  <desc id="desc">The Deployz connector in your AWS account starts every connection to Deployz over outbound HTTPS. Deployz has no inbound path into the account. The connector role is capped by a permissions boundary and limited to resources tagged for this deployment. It asks CloudFormation to apply the application template with the CloudFormation execution role, which can create IAM roles only under the /deployz/ path and only with the application role boundary. Application roles can pull the image, write logs, read tagged secrets, and use deployz-app S3 buckets and SQS queues, with no IAM management. The internet reaches only the load balancer. Your data and logs stay in your account.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. Mobile variant of security-access.svg.
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="360" height="1290" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>

    <!-- Deployz mark (public/deployz-icon-master.svg from deployz-website) -->
    <symbol id="mark" viewBox="0 0 349 349"><path d="M 111 113 L 109 115 L 109 116 L 108 117 L 108 236 L 110 238 L 110 239 L 111 239 L 112 240 L 232 240 L 233 239 L 234 239 L 236 236 L 236 116 L 235 115 L 235 114 L 234 114 L 231 112 L 114 112 L 113 113 ZM 27 43 L 27 44 L 23 49 L 23 51 L 22 52 L 22 53 L 21 54 L 21 56 L 20 57 L 20 61 L 19 62 L 19 290 L 20 291 L 20 294 L 21 295 L 21 297 L 22 298 L 22 299 L 23 300 L 24 303 L 26 305 L 26 306 L 34 314 L 37 315 L 39 317 L 41 317 L 44 319 L 46 319 L 47 320 L 50 320 L 51 321 L 229 321 L 230 320 L 237 320 L 238 319 L 243 319 L 244 318 L 247 318 L 248 317 L 250 317 L 251 316 L 253 316 L 254 315 L 257 315 L 258 314 L 259 314 L 260 313 L 262 313 L 267 310 L 269 310 L 270 309 L 271 309 L 273 307 L 274 307 L 275 306 L 278 305 L 280 303 L 281 303 L 283 301 L 284 301 L 288 297 L 289 297 L 297 289 L 298 289 L 300 287 L 300 286 L 306 280 L 306 279 L 308 277 L 308 276 L 311 273 L 311 272 L 313 270 L 314 267 L 316 265 L 316 264 L 317 263 L 317 262 L 318 261 L 318 260 L 321 255 L 321 253 L 322 252 L 322 250 L 323 249 L 323 247 L 324 246 L 324 244 L 325 243 L 325 241 L 326 240 L 326 236 L 327 235 L 327 231 L 328 230 L 328 219 L 329 218 L 329 194 L 328 193 L 274 193 L 273 194 L 273 234 L 272 235 L 272 238 L 271 239 L 271 241 L 270 242 L 270 243 L 269 244 L 268 247 L 264 252 L 264 253 L 256 261 L 255 261 L 252 264 L 251 264 L 250 265 L 249 265 L 244 268 L 242 268 L 241 269 L 239 269 L 238 270 L 236 270 L 235 271 L 230 271 L 229 272 L 85 272 L 84 271 L 82 271 L 81 270 L 78 269 L 73 264 L 73 263 L 71 260 L 71 258 L 70 257 L 70 94 L 71 93 L 71 91 L 72 90 L 73 87 L 78 82 L 79 82 L 82 80 L 84 80 L 85 79 L 230 79 L 231 80 L 236 80 L 237 81 L 240 81 L 241 82 L 243 82 L 244 83 L 246 83 L 247 84 L 250 85 L 255 89 L 256 89 L 266 99 L 266 100 L 268 102 L 268 103 L 271 108 L 271 110 L 272 111 L 272 114 L 273 115 L 273 159 L 329 159 L 329 129 L 328 128 L 328 118 L 327 117 L 327 112 L 326 111 L 326 107 L 325 106 L 325 104 L 324 103 L 324 100 L 323 99 L 323 97 L 321 94 L 321 92 L 320 91 L 320 90 L 319 89 L 319 88 L 318 87 L 318 86 L 317 85 L 317 84 L 316 83 L 316 82 L 315 81 L 315 80 L 314 79 L 313 76 L 311 74 L 311 73 L 309 71 L 309 70 L 306 67 L 306 66 L 290 50 L 289 50 L 286 47 L 285 47 L 282 44 L 281 44 L 279 42 L 278 42 L 277 41 L 276 41 L 275 40 L 274 40 L 273 39 L 272 39 L 271 38 L 270 38 L 269 37 L 268 37 L 267 36 L 266 36 L 261 33 L 259 33 L 258 32 L 256 32 L 255 31 L 252 31 L 251 30 L 248 30 L 247 29 L 244 29 L 243 28 L 237 28 L 236 27 L 53 27 L 52 28 L 49 28 L 48 29 L 46 29 L 45 30 L 43 30 L 42 31 L 39 32 L 37 34 L 36 34 Z" fill="#111111" fill-rule="evenodd" /></symbol>

    <!-- Icons: Lucide (ISC license), 24 x 24 -->
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /><path d="M2 12h20" /></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></symbol>
    <symbol id="i-network" viewBox="0 0 24 24"><rect x="16" y="16" width="6" height="6" rx="1" /><rect x="2" y="16" width="6" height="6" rx="1" /><rect x="9" y="2" width="6" height="6" rx="1" /><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3" /><path d="M12 12V8" /></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></symbol>
  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="359" height="1289" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="358" height="1288" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
    <ellipse cx="180" cy="260" rx="200" ry="160" fill="url(#light)" />
  </g>
  <g id="deployz">
    <rect x="150" y="16" width="180" height="28" rx="14" style="fill:#FFFFFF;stroke:#BFDBFE" filter="url(#shadow)" />
    <use href="#mark" x="205.43" y="23" width="14" height="14" />
    <text class="title" x="225.43" y="34.5">Deployz</text>
  </g>
  <g id="beam-outbound">
    <line class="beam" x1="190" y1="140" x2="190" y2="48" marker-end="url(#arrow)" />
    <circle class="port" cx="190" cy="140" r="3" />
    <rect x="122.4" y="56" width="135.2" height="20" rx="10" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <text class="mono-brand" x="190" y="70" text-anchor="middle">HTTPS · outbound</text>
  </g>
  <g id="beam-no-inbound">
    <line class="track-dashed" x1="290" y1="44" x2="290" y2="102" />
    <line class="track" x1="283" y1="102" x2="297" y2="102" />
    <rect x="236" y="80" width="108" height="20" rx="10" style="fill:#FFFFFF;stroke:#D4D4D8" />
    <use href="#i-x" class="icon" x="244" y="84" width="12" height="12" style="stroke:#71717A" />
    <text class="mono" x="298" y="94" text-anchor="middle">no inbound</text>
  </g>
  <g id="connector-role">
    <rect x="16" y="136" width="328" height="214" rx="15" style="fill:none;stroke:#2563EB;stroke-opacity:0.07;stroke-width:4" />
    <rect x="20" y="140" width="320" height="206" rx="12" style="fill:#FFFFFF;stroke:#BFDBFE" filter="url(#shadow-brand)" />
    <rect x="34" y="152" width="28" height="28" rx="7" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <use href="#mark" x="41" y="159" width="14" height="14" />
    <text class="title" x="72" y="163">Connector role</text>
    <text class="mono" x="72" y="179">assumed only by AWS Lambda</text>
    <line x1="20" y1="192" x2="340" y2="192" stroke="#E4E4E7" />
    <use href="#i-check" class="icon" x="36" y="210" width="14" height="14" style="stroke:#15803D" />
    <text class="body" x="58" y="221">Capped by a permissions boundary</text>
    <use href="#i-check" class="icon" x="36" y="236" width="14" height="14" style="stroke:#15803D" />
    <text class="body" x="58" y="247">Only resources tagged</text>
    <text class="body" x="58" y="264"><tspan class="mono-dark">deployz:installation</tspan></text>
    <use href="#i-x" class="icon" x="36" y="279" width="14" height="14" style="stroke:#B91C1C" />
    <text class="body" x="58" y="290">Can&#x27;t create the network,</text>
    <text class="body" x="58" y="307">database, or IAM roles</text>
    <use href="#i-x" class="icon" x="36" y="322" width="14" height="14" style="stroke:#B91C1C" />
    <text class="body" x="58" y="333">Can&#x27;t read log events</text>
  </g>
  <g id="arrow-cloudformation">
    <line class="track" x1="48" y1="346" x2="48" y2="398" marker-end="url(#arrow)" />
    <text class="note" x="60" y="368">Asks CloudFormation to apply</text>
    <text class="note" x="60" y="384">the application template</text>
  </g>
  <g id="execution-role">
    <rect class="tile" x="20" y="398" width="320" height="197" rx="12" filter="url(#shadow)" />
    <rect x="34" y="410" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-layers" class="icon" x="41" y="417" width="14" height="14" />
    <text class="title" x="72" y="421">CloudFormation execution role</text>
    <text class="mono" x="72" y="437">assumed only by CloudFormation</text>
    <line x1="20" y1="450" x2="340" y2="450" stroke="#E4E4E7" />
    <use href="#i-check" class="icon" x="36" y="468" width="14" height="14" style="stroke:#15803D" />
    <text class="body" x="58" y="479">Creates, changes, or deletes</text>
    <text class="body" x="58" y="496">only tagged resources</text>
    <use href="#i-check" class="icon" x="36" y="511" width="14" height="14" style="stroke:#15803D" />
    <text class="body" x="58" y="522">Creates roles only under <tspan class="mono-dark">/deployz/</tspan></text>
    <text class="body" x="58" y="539">with the role boundary</text>
    <use href="#i-check" class="icon" x="36" y="554" width="14" height="14" style="stroke:#15803D" />
    <text class="body" x="58" y="565">Attaches only</text>
    <text class="body" x="58" y="582"><tspan class="mono-dark">AmazonECSTaskExecutionRolePolicy</tspan></text>
  </g>
  <g id="arrow-creates">
    <line class="track" x1="48" y1="595" x2="48" y2="639" marker-end="url(#arrow)" />
    <text class="note" x="60" y="621">Creates the application&#x27;s IAM roles</text>
  </g>
  <g id="application-role-boundary">
    <rect class="boundary" x="20" y="651" width="320" height="241" rx="14" style="stroke:#D4D4D8" />
    <rect class="tag" x="36" y="639" width="220" height="24" rx="6" />
    <use href="#i-shield" class="icon" x="46" y="644" width="14" height="14" />
    <text class="title" x="66" y="655.5">Application role boundary</text>
    <rect class="tile" x="32" y="679" width="296" height="197" rx="12" filter="url(#shadow)" />
    <rect x="46" y="691" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-user" class="icon" x="53" y="698" width="14" height="14" />
    <text class="title" x="84" y="702">Application roles</text>
    <text class="mono" x="84" y="718">path /deployz/</text>
    <line x1="32" y1="731" x2="328" y2="731" stroke="#E4E4E7" />
    <use href="#i-check" class="icon" x="48" y="749" width="14" height="14" style="stroke:#15803D" />
    <text class="body" x="70" y="760">Pull the image, write logs,</text>
    <text class="body" x="70" y="777">read tagged secrets</text>
    <use href="#i-check" class="icon" x="48" y="792" width="14" height="14" style="stroke:#15803D" />
    <text class="body" x="70" y="803">Use <tspan class="mono-dark">deployz-app*</tspan> S3 buckets</text>
    <text class="body" x="70" y="820">and SQS queues</text>
    <use href="#i-x" class="icon" x="48" y="835" width="14" height="14" style="stroke:#B91C1C" />
    <text class="body" x="70" y="846">No IAM management, so it</text>
    <text class="body" x="70" y="863">can&#x27;t create or widen roles</text>
  </g>
  <g id="stays-in-account">
    <rect class="tile" x="20" y="912" width="320" height="198" rx="12" filter="url(#shadow)" />
    <rect x="34" y="924" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-lock" class="icon" x="41" y="931" width="14" height="14" />
    <text class="title" x="72" y="935">Stays in your account</text>
    <text class="note" x="72" y="951">Deployz never receives it</text>
    <line x1="20" y1="964" x2="340" y2="964" stroke="#E4E4E7" />
    <rect x="39" y="986" width="6" height="6" rx="3" style="fill:#A1A1AA" />
    <text class="body" x="58" y="993">Database data</text>
    <rect x="39" y="1012" width="6" height="6" rx="3" style="fill:#A1A1AA" />
    <text class="body" x="58" y="1019">Cache contents</text>
    <rect x="39" y="1038" width="6" height="6" rx="3" style="fill:#A1A1AA" />
    <text class="body" x="58" y="1045">Files in S3</text>
    <rect x="39" y="1064" width="6" height="6" rx="3" style="fill:#A1A1AA" />
    <text class="body" x="58" y="1071">Application logs</text>
    <rect x="39" y="1090" width="6" height="6" rx="3" style="fill:#A1A1AA" />
    <text class="body" x="58" y="1097">Your AWS credentials</text>
  </g>
  <g id="load-balancer">
    <rect class="tile" x="20" y="1130" width="320" height="44" rx="10" filter="url(#shadow)" />
    <rect x="29" y="1138" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-network" class="icon" x="36" y="1145" width="14" height="14" />
    <text class="title" x="65" y="1149">Load balancer</text>
    <text class="mono" x="65" y="1165">ports 80, 443</text>
    <text class="note" x="20" y="1194">The only part that accepts traffic</text>
    <text class="note" x="20" y="1210">from the internet</text>
    <line class="track" x1="290" y1="1242" x2="290" y2="1176" marker-end="url(#arrow)" />
  </g>
  <g id="account">
    <rect class="boundary" x="8" y="110" width="344" height="1116" rx="14" />
    <rect class="tag" x="24" y="98" width="136" height="24" rx="6" />
    <text class="title" x="36" y="114.5">Your AWS account</text>
  </g>
  <g id="internet">
    <rect x="230" y="1242" width="120" height="28" rx="14" style="fill:#FFFFFF;stroke:#E4E4E7" filter="url(#shadow)" />
    <use href="#i-globe" class="icon" x="251.92" y="1249" width="14" height="14" />
    <text class="title" x="271.92" y="1260.5">Internet</text>
  </g>
</svg>
