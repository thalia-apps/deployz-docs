<svg xmlns="http://www.w3.org/2000/svg" width="720" height="558" viewBox="0 0 720 558" role="img" aria-labelledby="title desc">
  <title id="title">How the connector carries out a change</title>
  <desc id="desc">How a change reaches the customer&#x27;s account. 1: you select Deploy update in the dashboard, and Deployz records the request. 2: the connector in the customer&#x27;s AWS account checks in with Deployz every minute. 3: Deployz returns the pending request. 4: the connector applies the change with AWS services such as CloudFormation and Amazon ECS. 5: the connector reports status and health to Deployz. 6: the dashboard shows the new status. Every connection between Deployz and the account starts from the connector.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. 
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="720" height="558" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>

    <!-- Deployz mark (public/deployz-icon-master.svg from deployz-website) -->
    <symbol id="mark" viewBox="0 0 349 349"><path d="M 111 113 L 109 115 L 109 116 L 108 117 L 108 236 L 110 238 L 110 239 L 111 239 L 112 240 L 232 240 L 233 239 L 234 239 L 236 236 L 236 116 L 235 115 L 235 114 L 234 114 L 231 112 L 114 112 L 113 113 ZM 27 43 L 27 44 L 23 49 L 23 51 L 22 52 L 22 53 L 21 54 L 21 56 L 20 57 L 20 61 L 19 62 L 19 290 L 20 291 L 20 294 L 21 295 L 21 297 L 22 298 L 22 299 L 23 300 L 24 303 L 26 305 L 26 306 L 34 314 L 37 315 L 39 317 L 41 317 L 44 319 L 46 319 L 47 320 L 50 320 L 51 321 L 229 321 L 230 320 L 237 320 L 238 319 L 243 319 L 244 318 L 247 318 L 248 317 L 250 317 L 251 316 L 253 316 L 254 315 L 257 315 L 258 314 L 259 314 L 260 313 L 262 313 L 267 310 L 269 310 L 270 309 L 271 309 L 273 307 L 274 307 L 275 306 L 278 305 L 280 303 L 281 303 L 283 301 L 284 301 L 288 297 L 289 297 L 297 289 L 298 289 L 300 287 L 300 286 L 306 280 L 306 279 L 308 277 L 308 276 L 311 273 L 311 272 L 313 270 L 314 267 L 316 265 L 316 264 L 317 263 L 317 262 L 318 261 L 318 260 L 321 255 L 321 253 L 322 252 L 322 250 L 323 249 L 323 247 L 324 246 L 324 244 L 325 243 L 325 241 L 326 240 L 326 236 L 327 235 L 327 231 L 328 230 L 328 219 L 329 218 L 329 194 L 328 193 L 274 193 L 273 194 L 273 234 L 272 235 L 272 238 L 271 239 L 271 241 L 270 242 L 270 243 L 269 244 L 268 247 L 264 252 L 264 253 L 256 261 L 255 261 L 252 264 L 251 264 L 250 265 L 249 265 L 244 268 L 242 268 L 241 269 L 239 269 L 238 270 L 236 270 L 235 271 L 230 271 L 229 272 L 85 272 L 84 271 L 82 271 L 81 270 L 78 269 L 73 264 L 73 263 L 71 260 L 71 258 L 70 257 L 70 94 L 71 93 L 71 91 L 72 90 L 73 87 L 78 82 L 79 82 L 82 80 L 84 80 L 85 79 L 230 79 L 231 80 L 236 80 L 237 81 L 240 81 L 241 82 L 243 82 L 244 83 L 246 83 L 247 84 L 250 85 L 255 89 L 256 89 L 266 99 L 266 100 L 268 102 L 268 103 L 271 108 L 271 110 L 272 111 L 272 114 L 273 115 L 273 159 L 329 159 L 329 129 L 328 128 L 328 118 L 327 117 L 327 112 L 326 111 L 326 107 L 325 106 L 325 104 L 324 103 L 324 100 L 323 99 L 323 97 L 321 94 L 321 92 L 320 91 L 320 90 L 319 89 L 319 88 L 318 87 L 318 86 L 317 85 L 317 84 L 316 83 L 316 82 L 315 81 L 315 80 L 314 79 L 313 76 L 311 74 L 311 73 L 309 71 L 309 70 L 306 67 L 306 66 L 290 50 L 289 50 L 286 47 L 285 47 L 282 44 L 281 44 L 279 42 L 278 42 L 277 41 L 276 41 L 275 40 L 274 40 L 273 39 L 272 39 L 271 38 L 270 38 L 269 37 L 268 37 L 267 36 L 266 36 L 261 33 L 259 33 L 258 32 L 256 32 L 255 31 L 252 31 L 251 30 L 248 30 L 247 29 L 244 29 L 243 28 L 237 28 L 236 27 L 53 27 L 52 28 L 49 28 L 48 29 L 46 29 L 45 30 L 43 30 L 42 31 L 39 32 L 37 34 L 36 34 Z" fill="#111111" fill-rule="evenodd" /></symbol>

    <!-- Icons: Lucide (ISC license), 24 x 24 -->
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" /></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></symbol>
  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="719" height="557" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="718" height="556" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
    <ellipse cx="446.4" cy="180" rx="220" ry="160" fill="url(#light)" />
  </g>
  <g id="customer-account">
    <rect class="boundary" x="384" y="28" width="318" height="486" rx="14" />
    <rect class="tag" x="400" y="16" width="164" height="24" rx="6" />
    <text class="title" x="412" y="32.5">Customer AWS account</text>
  </g>
  <g id="participants">
    <line x1="90" y1="84" x2="90" y2="496" stroke="#D4D4D8" stroke-dasharray="3 4" />
    <rect x="20" y="52" width="140" height="30" rx="15" style="fill:#FFFFFF;stroke:#E4E4E7" filter="url(#shadow)" />
    <use href="#i-user" class="icon" x="69.47" y="60" width="14" height="14" />
    <text class="title" x="89.47" y="71.5">You</text>
    <line x1="270" y1="84" x2="270" y2="496" stroke="#D4D4D8" stroke-dasharray="3 4" />
    <rect x="200" y="52" width="140" height="30" rx="15" style="fill:#FFFFFF;stroke:#BFDBFE" filter="url(#shadow)" />
    <use href="#mark" x="235.43" y="60" width="14" height="14" />
    <text class="title" x="255.43" y="71.5">Deployz</text>
    <line x1="470" y1="84" x2="470" y2="496" stroke="#D4D4D8" stroke-dasharray="3 4" />
    <rect x="400" y="52" width="140" height="30" rx="15" style="fill:#FFFFFF;stroke:#E4E4E7" filter="url(#shadow)" />
    <use href="#mark" x="428.41" y="60" width="14" height="14" />
    <text class="title" x="448.41" y="71.5">Connector</text>
    <line x1="630" y1="84" x2="630" y2="496" stroke="#D4D4D8" stroke-dasharray="3 4" />
    <rect x="560" y="52" width="140" height="30" rx="15" style="fill:#FFFFFF;stroke:#E4E4E7" filter="url(#shadow)" />
    <use href="#i-cloud" class="icon" x="577.88" y="60" width="14" height="14" />
    <text class="title" x="597.88" y="71.5">AWS services</text>
  </g>
  <g id="messages">
    <line class="track" x1="94" y1="122" x2="264" y2="122" marker-end="url(#arrow)" />
    <circle cx="115.8" cy="106" r="10" fill="#111111" />
    <text class="num" x="115.8" y="110" text-anchor="middle">1</text>
    <text class="note" x="129.8" y="110" style="fill:#111111">Select Deploy update</text>
    <line class="beam" x1="466" y1="186" x2="276" y2="186" marker-end="url(#arrow)" />
    <circle cx="299.68" cy="170" r="10" fill="#2563EB" />
    <text class="num" x="299.68" y="174" text-anchor="middle">2</text>
    <text class="note" x="313.68" y="174" style="fill:#111111">Check in, every minute</text>
    <line class="track-dashed" x1="274" y1="250" x2="464" y2="250" marker-end="url(#arrow)" />
    <circle cx="284.38" cy="234" r="10" fill="#111111" />
    <text class="num" x="284.38" y="238" text-anchor="middle">3</text>
    <text class="note" x="298.38" y="238" style="fill:#111111">Returns the pending request</text>
    <line class="track" x1="474" y1="314" x2="624" y2="314" marker-end="url(#arrow)" />
    <circle cx="498.04" cy="298" r="10" fill="#111111" />
    <text class="num" x="498.04" y="302" text-anchor="middle">4</text>
    <text class="note" x="512.04" y="302" style="fill:#111111">Apply the change</text>
    <line class="beam" x1="466" y1="378" x2="276" y2="378" marker-end="url(#arrow)" />
    <circle cx="293.56" cy="362" r="10" fill="#2563EB" />
    <text class="num" x="293.56" y="366" text-anchor="middle">5</text>
    <text class="note" x="307.56" y="366" style="fill:#111111">Report status and health</text>
    <line class="track-dashed" x1="266" y1="442" x2="96" y2="442" marker-end="url(#arrow)" />
    <circle cx="118.86" cy="426" r="10" fill="#111111" />
    <text class="num" x="118.86" y="430" text-anchor="middle">6</text>
    <text class="note" x="132.86" y="430" style="fill:#111111">Show the new status</text>
  </g>
  <g id="note">
    <use href="#i-shield" class="icon" x="20" y="515" width="14" height="14" style="stroke:#1D4ED8" />
    <text class="note" x="40" y="526">Every connection between Deployz and the account starts from the connector.</text>
  </g>
</svg>
