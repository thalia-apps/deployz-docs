<svg xmlns="http://www.w3.org/2000/svg" width="360" height="692" viewBox="0 0 360 692" role="img" aria-labelledby="title desc">
  <title id="title">Approve the connector stack in the AWS console</title>
  <desc id="desc">A simplified view of the AWS CloudFormation Quick create stack page. 1: check the AWS account and Region at the top of the console. 2: leave the stack name, which starts with deployz-bootstrap-, and the parameters ControlPlaneUrl, EnrollmentCode, and RelayCredential as they are. 3: select the check box that acknowledges that AWS CloudFormation might create IAM resources. 4: select Create stack, which creates the Deployz connector.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. Mobile variant of install-quick-create.svg.
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="360" height="692" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>



    <!-- Icons: Lucide (ISC license), 24 x 24 -->
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="359" height="691" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="358" height="690" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
  </g>
  <g id="console-window">
    <rect class="tile" x="40" y="24" width="304" height="452" rx="12" filter="url(#shadow)" />
    <path d="M40 36 a12 12 0 0 1 12 -12 H332 a12 12 0 0 1 12 12 V58 H40 Z" fill="#FAFAFA" />
    <line x1="40" y1="58" x2="344" y2="58" stroke="#E4E4E7" />
    <circle cx="58" cy="41" r="4" fill="#E4E4E7" />
    <circle cx="72" cy="41" r="4" fill="#E4E4E7" />
    <circle cx="86" cy="41" r="4" fill="#E4E4E7" />
    <text class="note" x="110" y="45.5">AWS console · CloudFormation (simplified)</text>
  </g>
  <g id="account-and-region">
    <rect x="41" y="58" width="302" height="44" fill="#FFFFFF" />
    <line x1="40" y1="102" x2="344" y2="102" stroke="#E4E4E7" />
    <rect x="204.08" y="68" width="123.92" height="24" rx="6" style="fill:#FFFFFF;stroke:#2563EB;stroke-width:1.5" />
    <text class="note" x="214.08" y="84" style="fill:#111111">Europe (Ireland)</text>
    <rect x="75.28" y="68" width="120.8" height="24" rx="6" style="fill:#FFFFFF;stroke:#2563EB;stroke-width:1.5" />
    <text class="mono-dark" x="85.28" y="84">1234-5678-9012</text>
    <circle cx="22" cy="80" r="10" fill="#2563EB" />
    <text class="num" x="22" y="84" text-anchor="middle">1</text>
  </g>
    <text class="heading" x="60" y="128">Quick create stack</text>
  <g id="stack-name">
    <text class="label" x="60" y="158">Stack name</text>
    <rect x="60" y="166" width="264" height="30" rx="6" style="fill:#FAFAFA;stroke:#D4D4D8" />
    <text class="mono-dark" x="70" y="185.5">deployz-bootstrap-…</text>
    <circle cx="22" cy="181" r="10" fill="#2563EB" />
    <text class="num" x="22" y="185" text-anchor="middle">2</text>
  </g>
  <g id="parameters">
    <text class="label" x="60" y="220">Parameters</text>
    <line x1="60" y1="258" x2="324" y2="258" stroke="#F4F4F5" />
    <text class="mono-dark" x="60" y="249">ControlPlaneUrl</text>
    <text class="mono" x="324" y="249" text-anchor="end">prefilled</text>
    <line x1="60" y1="288" x2="324" y2="288" stroke="#F4F4F5" />
    <text class="mono-dark" x="60" y="279">EnrollmentCode</text>
    <text class="mono" x="324" y="279" text-anchor="end">prefilled</text>
    <line x1="60" y1="318" x2="324" y2="318" stroke="#F4F4F5" />
    <text class="mono-dark" x="60" y="309">RelayCredential</text>
    <text class="mono" x="324" y="309" text-anchor="end">****</text>
  </g>
  <g id="capabilities">
    <text class="label" x="60" y="342">Capabilities</text>
    <rect x="60" y="352" width="264" height="72" rx="8" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <rect x="72" y="362" width="16" height="16" rx="4" style="fill:#2563EB" />
    <use href="#i-check" class="icon" x="74" y="364" width="12" height="12" style="stroke:#FFFFFF;stroke-width:3" />
    <text class="body" x="98" y="375">I acknowledge that AWS</text>
    <text class="body" x="98" y="393">CloudFormation might create IAM</text>
    <text class="body" x="98" y="411">resources.</text>
    <circle cx="22" cy="370" r="10" fill="#2563EB" />
    <text class="num" x="22" y="374" text-anchor="middle">3</text>
  </g>
  <g id="create-stack">
    <rect x="211.76" y="424" width="112.24" height="32" rx="8" style="fill:#111111" />
    <text class="title" x="267.88" y="444.5" text-anchor="middle" style="fill:#FFFFFF">Create stack</text>
    <text class="title" x="201.76" y="444.5" text-anchor="end" style="fill:#52525B">Cancel</text>
    <circle cx="22" cy="440" r="10" fill="#2563EB" />
    <text class="num" x="22" y="444" text-anchor="middle">4</text>
  </g>
  <g id="steps">
    <circle cx="26" cy="510" r="10" fill="#2563EB" />
    <text class="num" x="26" y="514" text-anchor="middle">1</text>
    <text class="title" x="44" y="514">Check the account and Region</text>
    <text class="note" x="44" y="530">They must match the install page.</text>
    <circle cx="26" cy="556" r="10" fill="#2563EB" />
    <text class="num" x="26" y="560" text-anchor="middle">2</text>
    <text class="title" x="44" y="560">Leave the defaults</text>
    <text class="note" x="44" y="576">The stack name and parameters come from the install link.</text>
    <circle cx="26" cy="602" r="10" fill="#2563EB" />
    <text class="num" x="26" y="606" text-anchor="middle">3</text>
    <text class="title" x="44" y="606">Acknowledge IAM resources</text>
    <text class="note" x="44" y="622">The connector stack creates IAM roles.</text>
    <circle cx="26" cy="648" r="10" fill="#2563EB" />
    <text class="num" x="26" y="652" text-anchor="middle">4</text>
    <text class="title" x="44" y="652">Select Create stack</text>
    <text class="note" x="44" y="668">This creates the Deployz connector.</text>
  </g>
</svg>
