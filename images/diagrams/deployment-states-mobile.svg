<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1379" viewBox="0 0 360 1379" role="img" aria-labelledby="title desc">
  <title id="title">Deployment states and badges</title>
  <desc id="desc">Deployment lifecycle. Not installed (badge Waiting for customer) moves to Waiting for AWS (Setting up) when the customer starts the install, to Installing (Setting up) when the connector connects, and to Healthy (Live) when the connector verifies health. A failed install goes to Failed (Install failed), and Retry deployment returns it to Installing. A healthy deployment shows Update available when a newer release is ready. Deploying an update, rolling back, or restarting shows Updating, then returns to Healthy; if it fails, the badge shows Update failed and the previous release keeps running. A configuration change keeps the Live badge, and a failed one also shows Update failed. Removing the deployment goes to Deleting (Removing), then Deleted (Removed). While installed, a lost connector, failing health checks, or an unrecognized status replace the badge with a Needs attention badge: Lost contact, Not responding, Degraded, or Unknown status.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. Mobile variant of deployment-states.svg.
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="360" height="1379" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>



    <!-- Icons: Lucide (ISC license), 24 x 24 -->
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></symbol>
  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="359" height="1378" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="358" height="1377" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
    <ellipse cx="180" cy="400" rx="180" ry="300" fill="url(#light)" />
  </g>
  <g id="not-installed">
    <rect class="tile" x="16" y="20" width="328" height="77" rx="12" filter="url(#shadow)" />
    <text class="title" x="30" y="47">Not installed</text>
    <rect x="30" y="59" width="148.4" height="22" rx="11" style="fill:#FAFAFA;stroke:#E4E4E7" />
    <circle cx="41" cy="70" r="3.5" fill="#A1A1AA" />
    <text class="badge" x="50" y="74.5" style="fill:#52525B">Waiting for customer</text>
  </g>
    <line class="track" x1="36" y1="97" x2="36" y2="135" marker-end="url(#arrow)" />
    <text class="note" x="48" y="125">Customer starts the install</text>
  <g id="waiting-for-aws">
    <rect class="tile" x="16" y="137" width="328" height="99" rx="12" filter="url(#shadow)" />
    <text class="title" x="30" y="164">Waiting for AWS</text>
    <rect x="30" y="176" width="87.2" height="22" rx="11" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <circle cx="41" cy="187" r="3.5" fill="#2563EB" />
    <text class="badge" x="50" y="191.5" style="fill:#1D4ED8">Setting up</text>
    <text class="note" x="30" y="213">After 15 minutes: Setting up · Slow to connect</text>
  </g>
    <line class="track" x1="36" y1="236" x2="36" y2="274" marker-end="url(#arrow)" />
    <text class="note" x="48" y="264">Connector connects</text>
  <g id="installing">
    <rect class="tile" x="16" y="276" width="328" height="77" rx="12" filter="url(#shadow)" />
    <text class="title" x="30" y="303">Installing</text>
    <rect x="30" y="315" width="87.2" height="22" rx="11" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <circle cx="41" cy="326" r="3.5" fill="#2563EB" />
    <text class="badge" x="50" y="330.5" style="fill:#1D4ED8">Setting up</text>
  </g>
    <text class="note" x="60" y="377">Install fails. Retry deployment returns.</text>
  <g id="failed">
    <rect class="tile" x="60" y="385" width="284" height="99" rx="12" filter="url(#shadow)" />
    <text class="title" x="74" y="412">Failed</text>
    <rect x="74" y="424" width="111.68" height="22" rx="11" style="fill:#FEF2F2;stroke:#FECACA" />
    <circle cx="85" cy="435" r="3.5" fill="#B91C1C" />
    <text class="badge" x="94" y="439.5" style="fill:#B91C1C">Install failed</text>
    <text class="note" x="74" y="461">Removal failed also uses this state</text>
  </g>
    <path class="track" d="M22 353 V411 H58" marker-end="url(#arrow)" />
    <line class="track" x1="36" y1="353" x2="36" y2="522" marker-end="url(#arrow)" />
    <text class="note" x="48" y="512">Connector verifies health</text>
  <g id="healthy">
    <rect x="12" y="520" width="336" height="107" rx="15" style="fill:none;stroke:#2563EB;stroke-opacity:0.07;stroke-width:4" />
    <rect x="16" y="524" width="328" height="99" rx="12" style="fill:#FFFFFF;stroke:#BFDBFE" filter="url(#shadow-brand)" />
    <text class="title" x="30" y="551">Healthy</text>
    <rect x="30" y="563" width="50.48" height="22" rx="11" style="fill:#F0FDF4;stroke:#BBF7D0" />
    <circle cx="41" cy="574" r="3.5" fill="#15803D" />
    <text class="badge" x="50" y="578.5" style="fill:#15803D">Live</text>
    <text class="note" x="30" y="600">Shows Not started before the first start</text>
  </g>
    <text class="note" x="60" y="647">Newer release ready</text>
  <g id="update-available">
    <rect class="tile" x="60" y="655" width="284" height="77" rx="12" filter="url(#shadow)" />
    <text class="title" x="74" y="682">Update available</text>
    <rect x="74" y="694" width="50.48" height="22" rx="11" style="fill:#F0FDF4;stroke:#BBF7D0" />
    <circle cx="85" cy="705" r="3.5" fill="#15803D" />
    <text class="badge" x="94" y="709.5" style="fill:#15803D">Live</text>
    <rect x="130.48" y="694" width="123.92" height="22" rx="11" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <circle cx="141.48" cy="705" r="3.5" fill="#2563EB" />
    <text class="badge" x="150.48" y="709.5" style="fill:#1D4ED8">Update available</text>
  </g>
    <path class="track" d="M22 623 V681 H58" marker-end="url(#arrow)" />
    <text class="note" x="60" y="756">Deploy update</text>
  <g id="updating">
    <rect class="tile" x="60" y="764" width="284" height="147" rx="12" filter="url(#shadow)" />
    <text class="title" x="74" y="791">Updating</text>
    <rect x="74" y="803" width="74.96" height="22" rx="11" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <circle cx="85" cy="814" r="3.5" fill="#2563EB" />
    <text class="badge" x="94" y="818.5" style="fill:#1D4ED8">Updating</text>
    <text class="note" x="74" y="840">Deploy, roll back, or restart. If it fails,</text>
    <text class="note" x="74" y="856">the badge shows Update failed and the</text>
    <text class="note" x="74" y="872">previous release keeps running.</text>
  </g>
    <path class="track" d="M22 623 V790 H58" marker-end="url(#arrow)" />
    <line class="track" x1="36" y1="623" x2="36" y2="949" marker-end="url(#arrow)" />
    <text class="note" x="48" y="939">Remove deployment</text>
  <g id="deleting">
    <rect class="tile" x="16" y="951" width="328" height="77" rx="12" filter="url(#shadow)" />
    <text class="title" x="30" y="978">Deleting</text>
    <rect x="30" y="990" width="74.96" height="22" rx="11" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <circle cx="41" cy="1001" r="3.5" fill="#2563EB" />
    <text class="badge" x="50" y="1005.5" style="fill:#1D4ED8">Removing</text>
  </g>
    <line class="track" x1="36" y1="1028" x2="36" y2="1066" marker-end="url(#arrow)" />
    <text class="note" x="48" y="1056">Removal finishes</text>
  <g id="deleted">
    <rect class="tile" x="16" y="1068" width="328" height="99" rx="12" filter="url(#shadow)" />
    <text class="title" x="30" y="1095">Deleted</text>
    <rect x="30" y="1107" width="68.84" height="22" rx="11" style="fill:#FAFAFA;stroke:#E4E4E7" />
    <circle cx="41" cy="1118" r="3.5" fill="#A1A1AA" />
    <text class="badge" x="50" y="1122.5" style="fill:#52525B">Removed</text>
    <text class="note" x="30" y="1144">Retained data may still exist</text>
  </g>
  <g id="needs-attention">
    <rect class="tile" x="16" y="1187" width="328" height="172" rx="12" filter="url(#shadow)" />
    <rect x="30" y="1199" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-alert" class="icon" x="37" y="1206" width="14" height="14" />
    <text class="title" x="68" y="1210">Needs attention</text>
    <text class="note" x="68" y="1226">Replaces the badge while installed</text>
    <line x1="16" y1="1239" x2="344" y2="1239" stroke="#E4E4E7" />
    <rect x="35" y="1261" width="6" height="6" rx="3" style="fill:#A1A1AA" />
    <text class="body" x="54" y="1268">Lost contact: connector offline</text>
    <rect x="35" y="1287" width="6" height="6" rx="3" style="fill:#A1A1AA" />
    <text class="body" x="54" y="1294">Not responding: health checks fail</text>
    <rect x="35" y="1313" width="6" height="6" rx="3" style="fill:#A1A1AA" />
    <text class="body" x="54" y="1320">Degraded: some health checks fail</text>
    <rect x="35" y="1339" width="6" height="6" rx="3" style="fill:#A1A1AA" />
    <text class="body" x="54" y="1346">Unknown status: not recognized</text>
  </g>
</svg>
