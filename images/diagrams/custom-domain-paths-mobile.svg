<svg xmlns="http://www.w3.org/2000/svg" width="360" height="595" viewBox="0 0 360 595" role="img" aria-labelledby="title desc">
  <title id="title">How a custom domain reaches the deployment</title>
  <desc id="desc">Two addresses for one deployment. Visitors to the default address, d-&lt;deployment-id&gt;.deployz.dev, pass through Deployz&#x27;s Cloudflare edge before they reach the load balancer in the customer&#x27;s AWS account. Visitors to a custom domain such as app.example.com go straight to the load balancer. The customer creates two CNAME records at their DNS provider: Verify ownership, so AWS Certificate Manager can issue the HTTPS certificate in the customer&#x27;s account, and Route traffic, which points the domain at the load balancer. Deployz only reads these records.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. Mobile variant of custom-domain-paths.svg.
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="360" height="595" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>



    <!-- Icons: Lucide (ISC license), 24 x 24 -->
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /><path d="M2 12h20" /></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></symbol>
    <symbol id="i-network" viewBox="0 0 24 24"><rect x="16" y="16" width="6" height="6" rx="1" /><rect x="2" y="16" width="6" height="6" rx="1" /><rect x="9" y="2" width="6" height="6" rx="1" /><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3" /><path d="M12 12V8" /></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></symbol>
  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="359" height="594" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="358" height="593" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
    <ellipse cx="251.99999999999997" cy="140" rx="220" ry="140" fill="url(#light)" />
  </g>
  <g id="paths">
    <text class="label" x="16" y="26">Default address</text>
    <rect x="16" y="40" width="156" height="28" rx="14" style="fill:#FFFFFF;stroke:#E4E4E7" filter="url(#shadow)" />
    <use href="#i-user" class="icon" x="59.43" y="47" width="14" height="14" />
    <text class="title" x="79.43" y="58.5">Visitor</text>
    <line class="track" x1="94" y1="68" x2="94" y2="90" />
    <rect x="19.2" y="90" width="149.6" height="20" rx="10" style="fill:#FFFFFF;stroke:#D4D4D8" />
    <text class="mono" x="94" y="104" text-anchor="middle">d-&lt;id&gt;.deployz.dev</text>
    <line class="track" x1="94" y1="110" x2="94" y2="128" marker-end="url(#arrow)" />
    <rect class="tile" x="16" y="130" width="156" height="44" rx="10" filter="url(#shadow)" />
    <rect x="25" y="138" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-globe" class="icon" x="32" y="145" width="14" height="14" />
    <text class="title" x="61" y="149">Deployz edge</text>
    <text class="mono" x="61" y="165">Cloudflare</text>
    <line class="track" x1="94" y1="174" x2="94" y2="254" marker-end="url(#arrow)" />
    <text class="label" x="188" y="26">Custom domain</text>
    <rect x="188" y="40" width="156" height="28" rx="14" style="fill:#FFFFFF;stroke:#E4E4E7" filter="url(#shadow)" />
    <use href="#i-user" class="icon" x="231.43" y="47" width="14" height="14" />
    <text class="title" x="251.43" y="58.5">Visitor</text>
    <line class="track" x1="266" y1="68" x2="266" y2="90" />
    <rect x="202" y="90" width="128" height="20" rx="10" style="fill:#FFFFFF;stroke:#D4D4D8" />
    <text class="mono" x="266" y="104" text-anchor="middle">app.example.com</text>
    <line class="track" x1="266" y1="110" x2="266" y2="254" marker-end="url(#arrow)" />
  </g>
    <text class="mono" x="266" y="190" text-anchor="middle">direct</text>
  <g id="customer-account">
    <rect class="boundary" x="8" y="236" width="344" height="140" rx="14" />
    <rect class="tag" x="24" y="224" width="164" height="24" rx="6" />
    <text class="title" x="36" y="240.5">Customer AWS account</text>
    <rect class="tile" x="16" y="260" width="328" height="44" rx="10" filter="url(#shadow)" />
    <rect x="25" y="268" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-network" class="icon" x="32" y="275" width="14" height="14" />
    <text class="title" x="61" y="279">Load balancer</text>
    <text class="mono" x="61" y="295">ports 80, 443</text>
    <rect class="tile" x="16" y="316" width="328" height="44" rx="10" filter="url(#shadow)" />
    <rect x="25" y="324" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-lock" class="icon" x="32" y="331" width="14" height="14" />
    <text class="title" x="61" y="335">HTTPS certificate</text>
    <text class="mono" x="61" y="351">ACM, in this account</text>
  </g>
  <g id="dns-records">
    <rect class="tile" x="16" y="404" width="328" height="171" rx="12" filter="url(#shadow)" />
    <rect x="30" y="416" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-globe" class="icon" x="37" y="423" width="14" height="14" />
    <text class="title" x="68" y="427">Customer&#x27;s DNS provider</text>
    <text class="note" x="68" y="443">Deployz only reads these records</text>
    <line x1="16" y1="456" x2="344" y2="456" stroke="#E4E4E7" />
    <use href="#i-check" class="icon" x="32" y="474" width="14" height="14" style="stroke:#15803D" />
    <text class="body" x="54" y="485"><tspan class="mono-dark">CNAME </tspan>Verify ownership</text>
    <text class="body" x="54" y="502">Lets ACM issue the certificate</text>
    <use href="#i-check" class="icon" x="32" y="517" width="14" height="14" style="stroke:#15803D" />
    <text class="body" x="54" y="528"><tspan class="mono-dark">CNAME </tspan>Route traffic</text>
    <text class="body" x="54" y="545">Points the domain at the</text>
    <text class="body" x="54" y="562">load balancer</text>
  </g>
</svg>
