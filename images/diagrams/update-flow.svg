<svg xmlns="http://www.w3.org/2000/svg" width="720" height="429" viewBox="0 0 720 429" role="img" aria-labelledby="title desc">
  <title id="title">What happens during an update</title>
  <desc id="desc">Deploying an update. You select Deploy update. Deployz runs the database migration once as a one-shot task; it must exit with code 0. Then each service moves to the new release while the current release keeps serving. Then the connector verifies that the new release is running and healthy, and the deployment is live on the new release. If the migration fails, no service changes and the previous release keeps serving. If the rollout or verification fails, the previous release stays live, and a migration that already ran stays applied. Either failure shows Update failed.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. 
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="720" height="429" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>



    <!-- Icons: Lucide (ISC license), 24 x 24 -->

  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="719" height="428" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="718" height="427" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
    <ellipse cx="360" cy="150" rx="320" ry="120" fill="url(#light)" />
  </g>
  <g id="start">
    <rect x="20" y="20" width="119.26" height="32" rx="8" style="fill:#111111" />
    <text class="title" x="79.63" y="40.5" text-anchor="middle" style="fill:#FFFFFF">Deploy update</text>
  </g>
  <g id="steps">
    <line class="track" x1="40" y1="52" x2="40" y2="82" marker-end="url(#arrow)" />
    <rect class="tile" x="20" y="84" width="160" height="134" rx="12" filter="url(#shadow)" />
    <circle cx="44" cy="108" r="10" fill="#2563EB" />
    <text class="num" x="44" y="112" text-anchor="middle">1</text>
    <text class="title" x="64" y="111">Run the</text>
    <text class="title" x="64" y="128">migration</text>
    <text class="note" x="64" y="149">One-shot task.</text>
    <text class="note" x="64" y="165">It must exit</text>
    <text class="note" x="64" y="181">with code 0.</text>
    <rect class="tile" x="200" y="84" width="160" height="134" rx="12" filter="url(#shadow)" />
    <circle cx="224" cy="108" r="10" fill="#2563EB" />
    <text class="num" x="224" y="112" text-anchor="middle">2</text>
    <text class="title" x="244" y="111">Move each</text>
    <text class="title" x="244" y="128">service</text>
    <text class="note" x="244" y="149">The current</text>
    <text class="note" x="244" y="165">release keeps</text>
    <text class="note" x="244" y="181">serving.</text>
    <line class="track" x1="180" y1="108" x2="198" y2="108" marker-end="url(#arrow)" />
    <rect class="tile" x="380" y="84" width="160" height="134" rx="12" filter="url(#shadow)" />
    <circle cx="404" cy="108" r="10" fill="#2563EB" />
    <text class="num" x="404" y="112" text-anchor="middle">3</text>
    <text class="title" x="424" y="111">Verify the</text>
    <text class="title" x="424" y="128">release</text>
    <text class="note" x="424" y="149">The connector</text>
    <text class="note" x="424" y="165">confirms it&#x27;s</text>
    <text class="note" x="424" y="181">running and</text>
    <text class="note" x="424" y="197">healthy.</text>
    <line class="track" x1="360" y1="108" x2="378" y2="108" marker-end="url(#arrow)" />
  </g>
  <g id="success">
    <line class="track" x1="540" y1="108" x2="558" y2="108" marker-end="url(#arrow)" />
    <rect class="tile" x="560" y="84" width="140" height="94" rx="12" filter="url(#shadow)" />
    <text class="title" x="574" y="111">Live on the new</text>
    <text class="title" x="574" y="128">release</text>
    <rect x="574" y="140" width="50.48" height="22" rx="11" style="fill:#F0FDF4;stroke:#BBF7D0" />
    <circle cx="585" cy="151" r="3.5" fill="#15803D" />
    <text class="badge" x="594" y="155.5" style="fill:#15803D">Live</text>
  </g>
  <g id="failures">
    <line class="track-dashed" x1="60" y1="218" x2="60" y2="272" marker-end="url(#arrow)" />
    <text class="note" x="68" y="250">fails</text>
    <rect x="20" y="274" width="160" height="131" rx="12" style="fill:#FEF2F2;stroke:#FECACA" />
    <text class="title" x="34" y="301">Migration fails</text>
    <rect x="34" y="313" width="105.56" height="22" rx="11" style="fill:#FEF2F2;stroke:#FECACA" />
    <circle cx="45" cy="324" r="3.5" fill="#B91C1C" />
    <text class="badge" x="54" y="328.5" style="fill:#B91C1C">Update failed</text>
    <text class="note" x="34" y="350">No service changes.</text>
    <text class="note" x="34" y="366">The previous release</text>
    <text class="note" x="34" y="382">keeps serving.</text>
    <line class="track-dashed" x1="240" y1="218" x2="240" y2="272" marker-end="url(#arrow)" />
    <line class="track-dashed" x1="420" y1="218" x2="420" y2="272" marker-end="url(#arrow)" />
    <text class="note" x="428" y="250">fails</text>
    <rect x="200" y="274" width="340" height="115" rx="12" style="fill:#FEF2F2;stroke:#FECACA" />
    <text class="title" x="214" y="301">Rollout or verification fails</text>
    <rect x="214" y="313" width="105.56" height="22" rx="11" style="fill:#FEF2F2;stroke:#FECACA" />
    <circle cx="225" cy="324" r="3.5" fill="#B91C1C" />
    <text class="badge" x="234" y="328.5" style="fill:#B91C1C">Update failed</text>
    <text class="note" x="214" y="350">The previous release stays live. A migration that</text>
    <text class="note" x="214" y="366">already ran stays applied.</text>
  </g>
</svg>
