<svg xmlns="http://www.w3.org/2000/svg" width="720" height="383" viewBox="0 0 720 383" role="img" aria-labelledby="title desc">
  <title id="title">Releases and deployments</title>
  <desc id="desc">Releases and deployments are separate. Commits on main become releases: v1.2.0 and v1.3.0 are Ready, and v1.4.0 is Building. The newest Ready release, v1.3.0, is labeled Customer installs; new installs get it. Customer A runs v1.3.0. Customer B still runs v1.2.0, and its deployment shows Update available. Creating a release doesn&#x27;t change any deployment.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. 
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="720" height="383" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>



    <!-- Icons: Lucide (ISC license), 24 x 24 -->
    <symbol id="i-commit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><line x1="3" x2="9" y1="12" y2="12" /><line x1="15" x2="21" y1="12" y2="12" /></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z" /><circle cx="7.5" cy="7.5" r=".5" /></symbol>
  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="719" height="382" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="718" height="381" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
    <ellipse cx="360.0" cy="160" rx="280" ry="140" fill="url(#light)" />
  </g>
  <g id="releases">
    <text class="label" x="24" y="26">Releases</text>
    <text class="mono" x="90" y="26">main</text>
    <rect class="tile" x="24" y="40" width="300" height="56" rx="10" filter="url(#shadow)" />
    <use href="#i-commit" class="icon" x="38" y="53" width="14" height="14" />
    <text class="mono" x="58" y="64.5">9c8d7e6</text>
    <rect x="128" y="50" width="77.2" height="22" rx="6" style="fill:#FAFAFA;stroke:#E4E4E7" />
    <use href="#i-tag" class="icon" x="134" y="54" width="14" height="14" />
    <text class="mono-dark" x="152" y="65.5">v1.4.0</text>
    <rect x="235.04" y="50" width="74.96" height="22" rx="11" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <circle cx="246.04" cy="61" r="3.5" fill="#2563EB" />
    <text class="badge" x="255.04" y="65.5" style="fill:#1D4ED8">Building</text>
    <rect class="tile" x="24" y="106" width="300" height="56" rx="10" filter="url(#shadow-brand)" />
    <rect x="24" y="106" width="300" height="56" rx="10" style="fill:none;stroke:#BFDBFE" />
    <use href="#i-commit" class="icon" x="38" y="119" width="14" height="14" />
    <text class="mono" x="58" y="130.5">e4f5a6b</text>
    <rect x="128" y="116" width="77.2" height="22" rx="6" style="fill:#FAFAFA;stroke:#E4E4E7" />
    <use href="#i-tag" class="icon" x="134" y="120" width="14" height="14" />
    <text class="mono-dark" x="152" y="131.5">v1.3.0</text>
    <rect x="253.4" y="116" width="56.6" height="22" rx="11" style="fill:#F0FDF4;stroke:#BBF7D0" />
    <circle cx="264.4" cy="127" r="3.5" fill="#15803D" />
    <text class="badge" x="273.4" y="131.5" style="fill:#15803D">Ready</text>
    <text class="badge" x="58" y="152" style="fill:#1D4ED8">Customer installs</text>
    <rect class="tile" x="24" y="172" width="300" height="56" rx="10" filter="url(#shadow)" />
    <use href="#i-commit" class="icon" x="38" y="185" width="14" height="14" />
    <text class="mono" x="58" y="196.5">a1b2c3d</text>
    <rect x="128" y="182" width="77.2" height="22" rx="6" style="fill:#FAFAFA;stroke:#E4E4E7" />
    <use href="#i-tag" class="icon" x="134" y="186" width="14" height="14" />
    <text class="mono-dark" x="152" y="197.5">v1.2.0</text>
    <rect x="253.4" y="182" width="56.6" height="22" rx="11" style="fill:#F0FDF4;stroke:#BBF7D0" />
    <circle cx="264.4" cy="193" r="3.5" fill="#15803D" />
    <text class="badge" x="273.4" y="197.5" style="fill:#15803D">Ready</text>
  </g>
  <g id="deployments">
    <text class="label" x="440" y="26">Deployments</text>
    <rect class="tile" x="440" y="40" width="256" height="99" rx="12" filter="url(#shadow)" />
    <text class="title" x="454" y="67">Customer A</text>
    <rect x="454" y="79" width="50.48" height="22" rx="11" style="fill:#F0FDF4;stroke:#BBF7D0" />
    <circle cx="465" cy="90" r="3.5" fill="#15803D" />
    <text class="badge" x="474" y="94.5" style="fill:#15803D">Live</text>
    <text class="note" x="454" y="116">runs v1.3.0</text>
    <path class="track" d="M324 127 C384 127 380 64 438 64" marker-end="url(#arrow)" />
    <rect class="tile" x="440" y="151" width="256" height="99" rx="12" filter="url(#shadow)" />
    <text class="title" x="454" y="178">Customer B</text>
    <rect x="454" y="190" width="50.48" height="22" rx="11" style="fill:#F0FDF4;stroke:#BBF7D0" />
    <circle cx="465" cy="201" r="3.5" fill="#15803D" />
    <text class="badge" x="474" y="205.5" style="fill:#15803D">Live</text>
    <rect x="510.48" y="190" width="123.92" height="22" rx="11" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <circle cx="521.48" cy="201" r="3.5" fill="#2563EB" />
    <text class="badge" x="530.48" y="205.5" style="fill:#1D4ED8">Update available</text>
    <text class="note" x="454" y="227">runs v1.2.0</text>
    <path class="track" d="M324 193 C384 193 380 175 438 175" marker-end="url(#arrow)" />
    <rect class="tile" x="440" y="262" width="256" height="69" rx="12" filter="url(#shadow)" />
    <text class="title" x="454" y="289">New installs</text>
    <text class="note" x="454" y="308">get v1.3.0</text>
    <path class="beam" d="M324 127 C384 127 380 286 438 286" marker-end="url(#arrow)" />
  </g>
  <g id="note">
    <use href="#i-tag" class="icon" x="22" y="344" width="14" height="14" />
    <text class="note" x="42" y="355">Creating a release doesn&#x27;t change any deployment. You choose when each one moves.</text>
  </g>
</svg>
