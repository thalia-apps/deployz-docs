<svg xmlns="http://www.w3.org/2000/svg" width="720" height="387" viewBox="0 0 720 387" role="img" aria-labelledby="title desc">
  <title id="title">How the health check works</title>
  <desc id="desc">How the health check works. The load balancer sends GET /health to the container on its configured port, for example 3000. The application must listen on 0.0.0.0, not 127.0.0.1, and return HTTP 200 once it&#x27;s ready. Common failures: the port doesn&#x27;t match, the server is bound to localhost, or the path redirects, returns 404, or needs sign-in. After an install or deploy finishes, the application has five minutes before health checks count. If it still isn&#x27;t healthy about 30 minutes after the install or deploy finished, Deployz marks it as failed.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. 
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="720" height="387" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>



    <!-- Icons: Lucide (ISC license), 24 x 24 -->
    <symbol id="i-network" viewBox="0 0 24 24"><rect x="16" y="16" width="6" height="6" rx="1" /><rect x="2" y="16" width="6" height="6" rx="1" /><rect x="9" y="2" width="6" height="6" rx="1" /><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3" /><path d="M12 12V8" /></symbol>
  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="719" height="386" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="718" height="385" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
    <ellipse cx="360.0" cy="110" rx="260" ry="100" fill="url(#light)" />
  </g>
  <g id="request">
    <rect class="tile" x="24" y="40" width="180" height="44" rx="10" filter="url(#shadow)" />
    <rect x="33" y="48" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-network" class="icon" x="40" y="55" width="14" height="14" />
    <text class="title" x="69" y="59">Load balancer</text>
    <text class="mono" x="69" y="75">health check</text>
    <line class="track" x1="204" y1="54" x2="446" y2="54" marker-end="url(#arrow)" />
    <rect x="250.2" y="44" width="149.6" height="20" rx="10" style="fill:#FFFFFF;stroke:#D4D4D8" />
    <text class="mono" x="325" y="58" text-anchor="middle">GET /health  :3000</text>
    <line class="beam" x1="446" y1="72" x2="206" y2="72" marker-end="url(#arrow)" />
    <rect x="293.4" y="62" width="63.2" height="20" rx="10" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <text class="mono-brand" x="325" y="76" text-anchor="middle">200 OK</text>
  </g>
  <g id="container">
    <rect class="boundary" x="448" y="26" width="252" height="92" rx="14" style="stroke:#D4D4D8" />
    <rect class="tag" x="464" y="14" width="122" height="24" rx="6" />
    <text class="title" x="476" y="30.5">Your container</text>
    <text class="note" x="464" y="64">Listens on</text>
    <text class="mono-dark" x="532" y="64">0.0.0.0:3000</text>
    <text class="note" x="464" y="84">Returns 200 when it&#x27;s ready</text>
  </g>
  <g id="common-failures">
    <text class="label" x="24" y="152">Common failures</text>
    <rect x="24" y="164" width="212" height="101" rx="12" style="fill:#FEF2F2;stroke:#FECACA" />
    <text class="title" x="38" y="191">Port doesn&#x27;t match</text>
    <text class="note" x="38" y="210">The Port setting must match</text>
    <text class="note" x="38" y="226">the port your application</text>
    <text class="note" x="38" y="242">listens on.</text>
    <rect x="252" y="164" width="212" height="101" rx="12" style="fill:#FEF2F2;stroke:#FECACA" />
    <text class="title" x="266" y="191">Bound to localhost</text>
    <text class="note" x="266" y="210">A server on 127.0.0.1 never</text>
    <text class="note" x="266" y="226">receives load balancer</text>
    <text class="note" x="266" y="242">requests.</text>
    <rect x="480" y="164" width="212" height="85" rx="12" style="fill:#FEF2F2;stroke:#FECACA" />
    <text class="title" x="494" y="191">Wrong response</text>
    <text class="note" x="494" y="210">A redirect, a 404, or a</text>
    <text class="note" x="494" y="226">sign-in page fails the check.</text>
  </g>
  <g id="timing">
    <text class="label" x="24" y="301">Timing after an install or deploy finishes</text>
    <rect x="24" y="323" width="188.16" height="10" rx="5" style="fill:#E4E4E7" />
    <rect x="214.16" y="323" width="401.2" height="10" rx="5" style="fill:#BFDBFE" />
    <rect x="617.36" y="323" width="78.64" height="10" rx="5" style="fill:#FECACA" />
    <text class="mono-dark" x="24" y="351">0 to 5 min</text>
    <text class="note" x="24" y="367">Checks don&#x27;t count yet</text>
    <text class="mono-dark" x="216.16" y="351">after 5 min</text>
    <text class="note" x="216.16" y="367">Checks count</text>
    <text class="mono-dark" x="696" y="351" text-anchor="end">about 30 min</text>
    <text class="note" x="696" y="367" text-anchor="end">Marked failed</text>
  </g>
</svg>
