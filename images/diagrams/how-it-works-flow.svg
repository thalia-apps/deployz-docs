<svg xmlns="http://www.w3.org/2000/svg" width="720" height="515" viewBox="0 0 720 515" role="img" aria-labelledby="title desc">
  <title id="title">From repository to running deployment</title>
  <desc id="desc">From repository to running deployment, in eight numbered steps. 1: you connect a GitHub repository, with read-only access. 2: Deployz analyzes it. 3: you create a release, such as v1.3.0. 4: you share an install link or invitation. 5: your customer approves the Quick Create stack in their AWS account. 6: the stack creates the Deployz connector, which runs every minute and connects outbound to Deployz only. 7: the deployment goes live at a permanent HTTPS address, d-&lt;deployment-id&gt;.deployz.dev. 8: you operate it from the dashboard, and the connector carries out each request.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. 
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="720" height="515" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>

    <!-- Deployz mark (public/deployz-icon-master.svg from deployz-website) -->
    <symbol id="mark" viewBox="0 0 349 349"><path d="M 111 113 L 109 115 L 109 116 L 108 117 L 108 236 L 110 238 L 110 239 L 111 239 L 112 240 L 232 240 L 233 239 L 234 239 L 236 236 L 236 116 L 235 115 L 235 114 L 234 114 L 231 112 L 114 112 L 113 113 ZM 27 43 L 27 44 L 23 49 L 23 51 L 22 52 L 22 53 L 21 54 L 21 56 L 20 57 L 20 61 L 19 62 L 19 290 L 20 291 L 20 294 L 21 295 L 21 297 L 22 298 L 22 299 L 23 300 L 24 303 L 26 305 L 26 306 L 34 314 L 37 315 L 39 317 L 41 317 L 44 319 L 46 319 L 47 320 L 50 320 L 51 321 L 229 321 L 230 320 L 237 320 L 238 319 L 243 319 L 244 318 L 247 318 L 248 317 L 250 317 L 251 316 L 253 316 L 254 315 L 257 315 L 258 314 L 259 314 L 260 313 L 262 313 L 267 310 L 269 310 L 270 309 L 271 309 L 273 307 L 274 307 L 275 306 L 278 305 L 280 303 L 281 303 L 283 301 L 284 301 L 288 297 L 289 297 L 297 289 L 298 289 L 300 287 L 300 286 L 306 280 L 306 279 L 308 277 L 308 276 L 311 273 L 311 272 L 313 270 L 314 267 L 316 265 L 316 264 L 317 263 L 317 262 L 318 261 L 318 260 L 321 255 L 321 253 L 322 252 L 322 250 L 323 249 L 323 247 L 324 246 L 324 244 L 325 243 L 325 241 L 326 240 L 326 236 L 327 235 L 327 231 L 328 230 L 328 219 L 329 218 L 329 194 L 328 193 L 274 193 L 273 194 L 273 234 L 272 235 L 272 238 L 271 239 L 271 241 L 270 242 L 270 243 L 269 244 L 268 247 L 264 252 L 264 253 L 256 261 L 255 261 L 252 264 L 251 264 L 250 265 L 249 265 L 244 268 L 242 268 L 241 269 L 239 269 L 238 270 L 236 270 L 235 271 L 230 271 L 229 272 L 85 272 L 84 271 L 82 271 L 81 270 L 78 269 L 73 264 L 73 263 L 71 260 L 71 258 L 70 257 L 70 94 L 71 93 L 71 91 L 72 90 L 73 87 L 78 82 L 79 82 L 82 80 L 84 80 L 85 79 L 230 79 L 231 80 L 236 80 L 237 81 L 240 81 L 241 82 L 243 82 L 244 83 L 246 83 L 247 84 L 250 85 L 255 89 L 256 89 L 266 99 L 266 100 L 268 102 L 268 103 L 271 108 L 271 110 L 272 111 L 272 114 L 273 115 L 273 159 L 329 159 L 329 129 L 328 128 L 328 118 L 327 117 L 327 112 L 326 111 L 326 107 L 325 106 L 325 104 L 324 103 L 324 100 L 323 99 L 323 97 L 321 94 L 321 92 L 320 91 L 320 90 L 319 89 L 319 88 L 318 87 L 318 86 L 317 85 L 317 84 L 316 83 L 316 82 L 315 81 L 315 80 L 314 79 L 313 76 L 311 74 L 311 73 L 309 71 L 309 70 L 306 67 L 306 66 L 290 50 L 289 50 L 286 47 L 285 47 L 282 44 L 281 44 L 279 42 L 278 42 L 277 41 L 276 41 L 275 40 L 274 40 L 273 39 L 272 39 L 271 38 L 270 38 L 269 37 L 268 37 L 267 36 L 266 36 L 261 33 L 259 33 L 258 32 L 256 32 L 255 31 L 252 31 L 251 30 L 248 30 L 247 29 L 244 29 L 243 28 L 237 28 L 236 27 L 53 27 L 52 28 L 49 28 L 48 29 L 46 29 L 45 30 L 43 30 L 42 31 L 39 32 L 37 34 L 36 34 Z" fill="#111111" fill-rule="evenodd" /></symbol>

    <!-- Icons: Lucide (ISC license), 24 x 24 -->
    <symbol id="i-git" viewBox="0 0 24 24"><circle cx="12" cy="18" r="3" /><circle cx="6" cy="6" r="3" /><circle cx="18" cy="6" r="3" /><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9" /><path d="M12 12v3" /></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2" /><line x1="8" x2="16" y1="21" y2="21" /><line x1="12" x2="12" y1="17" y2="21" /></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z" /><circle cx="7.5" cy="7.5" r=".5" /></symbol>
  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="719" height="514" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="718" height="513" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
    <ellipse cx="520" cy="320" rx="260" ry="160" fill="url(#light)" />
  </g>
  <g id="github">
    <rect class="boundary" x="16" y="40" width="168" height="100" rx="14" />
    <rect class="tag" x="32" y="28" width="101" height="24" rx="6" />
    <text class="title" x="44" y="44.5">Your GitHub</text>
    <rect class="tile" x="32" y="72" width="136" height="44" rx="10" filter="url(#shadow)" />
    <rect x="41" y="80" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-git" class="icon" x="48" y="87" width="14" height="14" />
    <text class="title" x="77" y="91">Repository</text>
    <text class="mono" x="77" y="107">read-only</text>
    <circle cx="32" cy="72" r="10" fill="#2563EB" />
    <text class="num" x="32" y="76" text-anchor="middle">1</text>
  </g>
  <g id="deployz">
    <rect class="boundary" x="200" y="40" width="232" height="336" rx="14" />
    <rect class="tag" x="216" y="28" width="73" height="24" rx="6" />
    <text class="title" x="228" y="44.5">Deployz</text>
    <rect class="tile" x="216" y="72" width="200" height="44" rx="10" filter="url(#shadow)" />
    <rect x="225" y="80" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-search" class="icon" x="232" y="87" width="14" height="14" />
    <text class="title" x="261" y="91">Analysis</text>
    <text class="mono" x="261" y="107">checks the fit</text>
    <circle cx="216" cy="72" r="10" fill="#2563EB" />
    <text class="num" x="216" y="76" text-anchor="middle">2</text>
    <rect class="tile" x="216" y="140" width="200" height="44" rx="10" filter="url(#shadow)" />
    <rect x="225" y="148" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-tag" class="icon" x="232" y="155" width="14" height="14" />
    <text class="title" x="261" y="159">Release</text>
    <text class="mono" x="261" y="175">v1.3.0</text>
    <circle cx="216" cy="140" r="10" fill="#2563EB" />
    <text class="num" x="216" y="144" text-anchor="middle">3</text>
    <rect class="tile" x="216" y="208" width="200" height="44" rx="10" filter="url(#shadow)" />
    <rect x="225" y="216" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-link" class="icon" x="232" y="223" width="14" height="14" />
    <text class="title" x="261" y="227">Install link</text>
    <text class="mono" x="261" y="243">or invitation</text>
    <circle cx="216" cy="208" r="10" fill="#2563EB" />
    <text class="num" x="216" y="212" text-anchor="middle">4</text>
    <rect class="tile" x="216" y="300" width="200" height="44" rx="10" filter="url(#shadow)" />
    <rect x="225" y="308" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-monitor" class="icon" x="232" y="315" width="14" height="14" />
    <text class="title" x="261" y="319">Dashboard</text>
    <text class="mono" x="261" y="335">operate deployments</text>
    <circle cx="216" cy="300" r="10" fill="#2563EB" />
    <text class="num" x="216" y="304" text-anchor="middle">8</text>
  </g>
  <g id="customer-aws-account">
    <rect class="boundary" x="484" y="176" width="220" height="319" rx="14" />
    <rect class="tag" x="500" y="164" width="164" height="24" rx="6" />
    <text class="title" x="512" y="180.5">Customer AWS account</text>
    <rect class="tile" x="500" y="208" width="190" height="44" rx="10" filter="url(#shadow)" />
    <rect x="509" y="216" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-layers" class="icon" x="516" y="223" width="14" height="14" />
    <text class="title" x="545" y="227">Quick Create stack</text>
    <text class="mono" x="545" y="243">customer approves</text>
    <circle cx="500" cy="208" r="10" fill="#2563EB" />
    <text class="num" x="500" y="212" text-anchor="middle">5</text>
    <rect class="tile" x="500" y="300" width="190" height="44" rx="10" style="fill:#FFFFFF;stroke:#BFDBFE" filter="url(#shadow-brand)" />
    <rect x="509" y="308" width="28" height="28" rx="7" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <use href="#mark" x="516" y="315" width="14" height="14" />
    <text class="title" x="545" y="319">Deployz connector</text>
    <text class="mono" x="545" y="335">runs every minute</text>
    <circle cx="500" cy="300" r="10" fill="#2563EB" />
    <text class="num" x="500" y="304" text-anchor="middle">6</text>
    <rect class="tile" x="500" y="380" width="190" height="99" rx="12" filter="url(#shadow)" />
    <text class="title" x="514" y="407">Your application</text>
    <rect x="514" y="419" width="50.48" height="22" rx="11" style="fill:#F0FDF4;stroke:#BBF7D0" />
    <circle cx="525" cy="430" r="3.5" fill="#15803D" />
    <text class="badge" x="534" y="434.5" style="fill:#15803D">Live</text>
    <text class="note" x="514" y="456">d-&lt;id&gt;.deployz.dev</text>
    <circle cx="500" cy="380" r="10" fill="#2563EB" />
    <text class="num" x="500" y="384" text-anchor="middle">7</text>
  </g>
  <g id="flow">
    <line class="track" x1="168" y1="96" x2="214" y2="96" marker-end="url(#arrow)" />
    <line class="track" x1="316" y1="120" x2="316" y2="138" marker-end="url(#arrow)" />
    <line class="track" x1="316" y1="188" x2="316" y2="206" marker-end="url(#arrow)" />
    <line class="track" x1="416" y1="232" x2="498" y2="232" marker-end="url(#arrow)" />
    <line class="track" x1="595" y1="256" x2="595" y2="298" marker-end="url(#arrow)" />
    <line class="track" x1="595" y1="348" x2="595" y2="378" marker-end="url(#arrow)" />
  </g>

  <!-- The connector connects outbound to Deployz only -->
  <g id="beam-outbound">
    <line class="beam" x1="500" y1="324" x2="418" y2="324" marker-end="url(#arrow)" />
    <circle class="port" cx="500" cy="324" r="3" />
    <rect x="419.2" y="314" width="77.6" height="20" rx="10" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <text class="mono-brand" x="458" y="328" text-anchor="middle">outbound</text>
  </g>
</svg>
