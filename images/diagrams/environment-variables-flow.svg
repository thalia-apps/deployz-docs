    <rect x="236" y="95.5" width="196" height="101" rx="12" style="fill:#FFFFFF;stroke:#BFDBFE" filter="url(#shadow-brand)" />
    <rect x="248" y="105.5" width="28" height="28" rx="7" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <use href="#mark" x="255" y="112.5" width="14" height="14" />
    <text class="title" x="280" y="122.5">Deployz</text>
