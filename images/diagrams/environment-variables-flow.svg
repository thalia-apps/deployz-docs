<svg xmlns="http://www.w3.org/2000/svg" width="720" height="658" viewBox="0 0 720 658" role="img" aria-labelledby="title desc">
  <title id="title">Where environment variable values go</title>
  <desc id="desc">Where environment variable values go. You, each customer, and Deployz provide values. Deployz stores saved secrets encrypted with AWS KMS and delivers each value where it&#x27;s used. Build values, which only you provide, go into the release&#x27;s container image, which is the same for every customer, so don&#x27;t use them for secrets. Runtime values go to each customer&#x27;s AWS account: your runtime values, that customer&#x27;s own values, and secrets Deployz generates for that deployment. Plain values are set on the Amazon ECS task definition, and secret values are stored in AWS Secrets Manager. The account owner can read them there.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. 
  -->

