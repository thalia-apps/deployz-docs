23 97 L 321 94 L 321 92 L 320 91 L 320 90 L 319 89 L 319 88 L 318 87 L 318 86 L 317 85 L 317 84 L 316 83 L 316 82 L 315 81 L 315 80 L 314 79 L 313 76 L 311 74 L 311 73 L 309 71 L 309 70 L 306 67 L 306 66 L 290 50 L 289 50 L 286 47 L 285 47 L 282 44 L 281 44 L 279 42 L 278 42 L 277 41 L 276 41 L 275 40 L 274 40 L 273 39 L 272 39 L 271 38 L 270 38 L 269 37 L 268 37 L 267 36 L 266 36 L 261 33 L 259 33 L 258 32 L 256 32 L 255 31 L 252 31 L 251 30 L 248 30 L 247 29 L 244 29 L 243 28 L 237 28 L 236 27 L 53 27 L 52 28 L 49 28 L 48 29 L 46 29 L 45 30 L 43 30 L 42 31 L 39 32 L 37 34 L 36 34 Z" fill="#111111" fill-rule="evenodd" /></symbol>

