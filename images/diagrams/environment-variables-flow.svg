    <rect x="490" y="52" width="28" height="28" rx="7" class="icon-tile" />
    <use href="#i-box" class="icon" x="497" y="59" width="14" height="14" />
    <text class="title" x="528" y="63">Container image</text>
    <text class="mono" x="528" y="79">build values</text>
    <line x1="476" y1="92" x2="704" y2="92" stroke="#E4E4E7" />
