<svg xmlns="http://www.w3.org/2000/svg" width="360" height="730" viewBox="0 0 360 730" role="img" aria-labelledby="title desc">
  <title id="title">Parts of the recovery panel</title>
  <desc id="desc">The recovery panel for a failed update, read from top to bottom. 1, what happened: Update failed, the database migration step failed, so the new version was not started. 2, impact: Release v1.3.0 is still live and unaffected. 3, cause and fix: why it happened and how to fix it. 4, recoverability: needs a change before a retry can succeed. 5, actions: Retry update. 6, Technical details, collapsed by default, with the failure code.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. Mobile variant of recovery-panel.svg.
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="360" height="730" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>



    <!-- Icons: Lucide (ISC license), 24 x 24 -->
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="359" height="729" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="358" height="728" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
  </g>
  <g id="panel">
    <rect x="44" y="24" width="300" height="436" rx="12" style="fill:#FFFFFF;stroke:#FECACA" filter="url(#shadow)" />
    <rect x="44" y="24" width="4" height="436" rx="2" fill="#B91C1C" />
  </g>
  <g id="what-happened">
    <use href="#i-alert" class="icon" x="64" y="46" width="16" height="16" style="stroke:#B91C1C" />
    <text class="heading" x="88" y="59" style="fill:#B91C1C">Update failed</text>
    <text class="body" x="64" y="82">The database migration step failed, so</text>
    <text class="body" x="64" y="100">the new version was not started.</text>
  </g>
  <g id="impact">
    <use href="#i-check" class="icon" x="64" y="120" width="14" height="14" style="stroke:#15803D" />
    <text class="body" x="86" y="131">Release v1.3.0 is still live and</text>
    <text class="body" x="86" y="149">unaffected.</text>
  </g>
  <g id="cause-and-fix">
    <text class="label" x="64" y="188">Why it happened</text>
    <text class="body" x="64" y="206">The migration command exited with an</text>
    <text class="body" x="64" y="224">error.</text>
    <text class="label" x="64" y="252">How to fix it</text>
    <text class="body" x="64" y="270">Fix the migration in your repository,</text>
    <text class="body" x="64" y="288">publish a new release, and deploy it.</text>
  </g>
  <g id="recoverability">
    <use href="#i-alert" class="icon" x="64" y="311" width="14" height="14" style="stroke:#A16207" />
    <text class="body" x="86" y="323" style="fill:#A16207">Needs a change before a retry can</text>
    <text class="body" x="86" y="341" style="fill:#A16207">succeed — see the fix above.</text>
  </g>
  <g id="actions">
    <rect x="64" y="368" width="112.24" height="32" rx="8" style="fill:#111111" />
    <text class="title" x="120.12" y="388.5" text-anchor="middle" style="fill:#FFFFFF">Retry update</text>
  </g>
  <g id="technical-details">
    <line x1="44" y1="420" x2="344" y2="420" stroke="#E4E4E7" />
    <use href="#i-chevron" class="icon" x="62" y="433" width="14" height="14" />
    <text class="title" x="82" y="445">Technical details</text>
  </g>
  <g id="callouts">
    <circle cx="22" cy="56" r="10" fill="#2563EB" />
    <text class="num" x="22" y="60" text-anchor="middle">1</text>
    <circle cx="22" cy="127" r="10" fill="#2563EB" />
    <text class="num" x="22" y="131" text-anchor="middle">2</text>
    <circle cx="22" cy="216" r="10" fill="#2563EB" />
    <text class="num" x="22" y="220" text-anchor="middle">3</text>
    <circle cx="22" cy="319" r="10" fill="#2563EB" />
    <text class="num" x="22" y="323" text-anchor="middle">4</text>
    <circle cx="22" cy="384" r="10" fill="#2563EB" />
    <text class="num" x="22" y="388" text-anchor="middle">5</text>
    <circle cx="22" cy="440" r="10" fill="#2563EB" />
    <text class="num" x="22" y="444" text-anchor="middle">6</text>
    <circle cx="26" cy="498" r="10" fill="#2563EB" />
    <text class="num" x="26" y="502" text-anchor="middle">1</text>
    <text class="title" x="44" y="502">What happened</text>
    <circle cx="26" cy="530" r="10" fill="#2563EB" />
    <text class="num" x="26" y="534" text-anchor="middle">2</text>
    <text class="title" x="44" y="534">Impact</text>
    <text class="note" x="44" y="550">What still works</text>
    <circle cx="26" cy="576" r="10" fill="#2563EB" />
    <text class="num" x="26" y="580" text-anchor="middle">3</text>
    <text class="title" x="44" y="580">Cause and fix</text>
    <circle cx="26" cy="608" r="10" fill="#2563EB" />
    <text class="num" x="26" y="612" text-anchor="middle">4</text>
    <text class="title" x="44" y="612">Recoverability</text>
    <text class="note" x="44" y="628">Who acts, and if a retry helps</text>
    <circle cx="26" cy="654" r="10" fill="#2563EB" />
    <text class="num" x="26" y="658" text-anchor="middle">5</text>
    <text class="title" x="44" y="658">Actions</text>
    <circle cx="26" cy="686" r="10" fill="#2563EB" />
    <text class="num" x="26" y="690" text-anchor="middle">6</text>
    <text class="title" x="44" y="690">Technical details</text>
    <text class="note" x="44" y="706">Failure code, AWS resource, errors</text>
  </g>
</svg>
