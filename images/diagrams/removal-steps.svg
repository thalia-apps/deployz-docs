<svg xmlns="http://www.w3.org/2000/svg" width="720" height="492" viewBox="0 0 720 492" role="img" aria-labelledby="title desc">
  <title id="title">What removal deletes and keeps</title>
  <desc id="desc">What stays in the customer&#x27;s AWS account after each removal step. Before removal, everything is in place. Step 1, Remove deployment in Deployz, deletes the application containers, the load balancer and most networking, the cache, configuration secret, and log groups, and the custom domain. It keeps the database, its credentials, the storage bucket, the certificates, the network the database uses, and the connector stack. Retained resources keep costing money in AWS. Step 2, Delete retained data, deletes everything retained except the connector stack. Step 3, deleting the connector stack in the AWS console, removes the last part. Delete the connector stack last.</desc>

