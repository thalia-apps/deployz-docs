<svg xmlns="http://www.w3.org/2000/svg" width="360" height="706" viewBox="0 0 360 706" role="img" aria-labelledby="title desc">
  <title id="title">How the connector carries out a change</title>
  <desc id="desc">How a change reaches the customer&#x27;s account. 1: you select Deploy update in the dashboard, and Deployz records the request. 2: the connector in the customer&#x27;s AWS account checks in with Deployz every minute. 3: Deployz returns the pending request. 4: the connector applies the change with AWS services such as CloudFormation and Amazon ECS. 5: the connector reports status and health to Deployz. 6: the dashboard shows the new status. Every connection between Deployz and the account starts from the connector.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. Mobile variant of connector-check-in.svg.
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="360" height="706" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>



    <!-- Icons: Lucide (ISC license), 24 x 24 -->
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /></symbol>
  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="359" height="705" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="358" height="704" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
    <ellipse cx="223.2" cy="180" rx="220" ry="160" fill="url(#light)" />
  </g>
  <g id="customer-account">
    <rect class="boundary" x="168" y="28" width="184" height="450" rx="14" />
    <rect class="tag" x="184" y="16" width="108" height="24" rx="6" />
    <text class="title" x="196" y="32.5">Customer AWS</text>
  </g>
  <g id="participants">
    <line x1="42" y1="84" x2="42" y2="460" stroke="#D4D4D8" stroke-dasharray="3 4" />
    <rect x="4" y="52" width="76" height="30" rx="15" style="fill:#FFFFFF;stroke:#E4E4E7" filter="url(#shadow)" />
    <text class="title" x="31.47" y="71.5">You</text>
    <line x1="124" y1="84" x2="124" y2="460" stroke="#D4D4D8" stroke-dasharray="3 4" />
    <rect x="86" y="52" width="76" height="30" rx="15" style="fill:#FFFFFF;stroke:#BFDBFE" filter="url(#shadow)" />
    <text class="title" x="99.43" y="71.5">Deployz</text>
    <line x1="218" y1="84" x2="218" y2="460" stroke="#D4D4D8" stroke-dasharray="3 4" />
    <rect x="180" y="52" width="76" height="30" rx="15" style="fill:#FFFFFF;stroke:#E4E4E7" filter="url(#shadow)" />
    <text class="title" x="186.41" y="71.5">Connector</text>
    <line x1="310" y1="84" x2="310" y2="460" stroke="#D4D4D8" stroke-dasharray="3 4" />
    <rect x="272" y="52" width="76" height="30" rx="15" style="fill:#FFFFFF;stroke:#E4E4E7" filter="url(#shadow)" />
    <text class="title" x="299.47" y="71.5">AWS</text>
  </g>
  <g id="messages">
    <line class="track" x1="46" y1="122" x2="118" y2="122" marker-end="url(#arrow)" />
    <circle cx="40.22" cy="106" r="10" fill="#111111" />
    <text class="num" x="40.22" y="110" text-anchor="middle">1</text>
    <text class="note" x="54.22" y="110" style="fill:#111111">Deploy update</text>
    <line class="beam" x1="214" y1="180" x2="130" y2="180" marker-end="url(#arrow)" />
    <circle cx="143.52" cy="164" r="10" fill="#2563EB" />
    <text class="num" x="143.52" y="168" text-anchor="middle">2</text>
    <text class="note" x="157.52" y="168" style="fill:#111111">Check in</text>
    <line class="track-dashed" x1="128" y1="238" x2="212" y2="238" marker-end="url(#arrow)" />
    <circle cx="152.7" cy="222" r="10" fill="#111111" />
    <text class="num" x="152.7" y="226" text-anchor="middle">3</text>
    <text class="note" x="166.7" y="226" style="fill:#111111">Reply</text>
    <line class="track" x1="222" y1="296" x2="304" y2="296" marker-end="url(#arrow)" />
    <circle cx="245.7" cy="280" r="10" fill="#111111" />
    <text class="num" x="245.7" y="284" text-anchor="middle">4</text>
    <text class="note" x="259.7" y="284" style="fill:#111111">Apply</text>
    <line class="beam" x1="214" y1="354" x2="130" y2="354" marker-end="url(#arrow)" />
    <circle cx="149.64" cy="338" r="10" fill="#2563EB" />
    <text class="num" x="149.64" y="342" text-anchor="middle">5</text>
    <text class="note" x="163.64" y="342" style="fill:#111111">Report</text>
    <line class="track-dashed" x1="120" y1="412" x2="48" y2="412" marker-end="url(#arrow)" />
    <circle cx="61.64" cy="396" r="10" fill="#111111" />
    <text class="num" x="61.64" y="400" text-anchor="middle">6</text>
    <text class="note" x="75.64" y="400" style="fill:#111111">Status</text>
  </g>
  <g id="note">
    <use href="#i-shield" class="icon" x="20" y="479" width="14" height="14" style="stroke:#1D4ED8" />
    <text class="note" x="40" y="490">Every connection between Deployz and the account</text>
    <text class="note" x="40" y="506">starts from the connector.</text>
  </g>
  <g id="steps">
    <circle cx="26" cy="540" r="10" fill="#111111" />
    <text class="num" x="26" y="544" text-anchor="middle">1</text>
    <text class="body" x="44" y="544.5">Select Deploy update</text>
    <circle cx="26" cy="566" r="10" fill="#2563EB" />
    <text class="num" x="26" y="570" text-anchor="middle">2</text>
    <text class="body" x="44" y="570.5">Check in, every minute</text>
    <circle cx="26" cy="592" r="10" fill="#111111" />
    <text class="num" x="26" y="596" text-anchor="middle">3</text>
    <text class="body" x="44" y="596.5">Returns the pending request</text>
    <circle cx="26" cy="618" r="10" fill="#111111" />
    <text class="num" x="26" y="622" text-anchor="middle">4</text>
    <text class="body" x="44" y="622.5">Apply the change</text>
    <circle cx="26" cy="644" r="10" fill="#2563EB" />
    <text class="num" x="26" y="648" text-anchor="middle">5</text>
    <text class="body" x="44" y="648.5">Report status and health</text>
    <circle cx="26" cy="670" r="10" fill="#111111" />
    <text class="num" x="26" y="674" text-anchor="middle">6</text>
    <text class="body" x="44" y="674.5">Show the new status</text>
  </g>
</svg>
