<svg xmlns="http://www.w3.org/2000/svg" width="360" height="778" viewBox="0 0 360 778" role="img" aria-labelledby="title desc">
  <title id="title">What happens during an update</title>
  <desc id="desc">Deploying an update. You select Deploy update. Deployz runs the database migration once as a one-shot task; it must exit with code 0. Then each service moves to the new release while the current release keeps serving. Then the connector verifies that the new release is running and healthy, and the deployment is live on the new release. If the migration fails, no service changes and the previous release keeps serving. If the rollout or verification fails, the previous release stays live, and a migration that already ran stays applied. Either failure shows Update failed.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. Mobile variant of update-flow.svg.
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="360" height="778" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>



    <!-- Icons: Lucide (ISC license), 24 x 24 -->

  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="359" height="777" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="358" height="776" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
    <ellipse cx="180" cy="300" rx="180" ry="260" fill="url(#light)" />
  </g>
  <g id="start">
    <rect x="16" y="20" width="119.26" height="32" rx="8" style="fill:#111111" />
    <text class="title" x="75.63" y="40.5" text-anchor="middle" style="fill:#FFFFFF">Deploy update</text>
  </g>
    <line class="track" x1="36" y1="52" x2="36" y2="78" marker-end="url(#arrow)" />
  <g id="step-1">
    <rect class="tile" x="16" y="80" width="328" height="69" rx="12" filter="url(#shadow)" />
    <circle cx="40" cy="104" r="10" fill="#2563EB" />
    <text class="num" x="40" y="108" text-anchor="middle">1</text>
    <text class="title" x="60" y="107">Run the migration</text>
    <text class="note" x="60" y="126">One-shot task. It must exit with code 0.</text>
  </g>
    <text class="note" x="60" y="173">If it fails</text>
  <g id="failure-migration">
    <rect x="60" y="181" width="284" height="115" rx="12" style="fill:#FEF2F2;stroke:#FECACA" />
    <text class="title" x="74" y="208">Migration fails</text>
    <rect x="74" y="220" width="105.56" height="22" rx="11" style="fill:#FEF2F2;stroke:#FECACA" />
    <circle cx="85" cy="231" r="3.5" fill="#B91C1C" />
    <text class="badge" x="94" y="235.5" style="fill:#B91C1C">Update failed</text>
    <text class="note" x="74" y="257">No service changes. The previous release</text>
    <text class="note" x="74" y="273">keeps serving.</text>
  </g>
    <path class="track-dashed" d="M22 149 V207 H58" marker-end="url(#arrow)" />
    <line class="track" x1="36" y1="149" x2="36" y2="322" marker-end="url(#arrow)" />
  <g id="step-2">
    <rect class="tile" x="16" y="324" width="328" height="69" rx="12" filter="url(#shadow)" />
    <circle cx="40" cy="348" r="10" fill="#2563EB" />
    <text class="num" x="40" y="352" text-anchor="middle">2</text>
    <text class="title" x="60" y="351">Move each service</text>
    <text class="note" x="60" y="370">The current release keeps serving.</text>
  </g>
    <line class="track" x1="36" y1="393" x2="36" y2="419" marker-end="url(#arrow)" />
  <g id="step-3">
    <rect class="tile" x="16" y="421" width="328" height="85" rx="12" filter="url(#shadow)" />
    <circle cx="40" cy="445" r="10" fill="#2563EB" />
    <text class="num" x="40" y="449" text-anchor="middle">3</text>
    <text class="title" x="60" y="448">Verify the release</text>
    <text class="note" x="60" y="467">The connector confirms it&#x27;s running and</text>
    <text class="note" x="60" y="483">healthy.</text>
  </g>
    <text class="note" x="60" y="530">If it fails</text>
  <g id="failure-rollout">
    <rect x="60" y="538" width="284" height="115" rx="12" style="fill:#FEF2F2;stroke:#FECACA" />
    <text class="title" x="74" y="565">Rollout or verification fails</text>
    <rect x="74" y="577" width="105.56" height="22" rx="11" style="fill:#FEF2F2;stroke:#FECACA" />
    <circle cx="85" cy="588" r="3.5" fill="#B91C1C" />
    <text class="badge" x="94" y="592.5" style="fill:#B91C1C">Update failed</text>
    <text class="note" x="74" y="614">The previous release stays live. A</text>
    <text class="note" x="74" y="630">migration that already ran stays applied.</text>
  </g>
    <path class="track-dashed" d="M22 506 V564 H58" marker-end="url(#arrow)" />
    <line class="track" x1="36" y1="506" x2="36" y2="679" marker-end="url(#arrow)" />
  <g id="success">
    <rect class="tile" x="16" y="681" width="328" height="77" rx="12" filter="url(#shadow)" />
    <text class="title" x="30" y="708">Live on the new release</text>
    <rect x="30" y="720" width="50.48" height="22" rx="11" style="fill:#F0FDF4;stroke:#BBF7D0" />
    <circle cx="41" cy="731" r="3.5" fill="#15803D" />
    <text class="badge" x="50" y="735.5" style="fill:#15803D">Live</text>
  </g>
</svg>
