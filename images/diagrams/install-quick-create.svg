<svg xmlns="http://www.w3.org/2000/svg" width="720" height="482" viewBox="0 0 720 482" role="img" aria-labelledby="title desc">
  <title id="title">Approve the connector stack in the AWS console</title>
  <desc id="desc">A simplified view of the AWS CloudFormation Quick create stack page. 1: check the AWS account and Region at the top of the console. 2: leave the stack name, which starts with deployz-bootstrap-, and the parameters ControlPlaneUrl, EnrollmentCode, and RelayCredential as they are. 3: select the check box that acknowledges that AWS CloudFormation might create IAM resources. 4: select Create stack, which creates the Deployz connector.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. 
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="720" height="482" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>



    <!-- Icons: Lucide (ISC license), 24 x 24 -->
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="719" height="481" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="718" height="480" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
  </g>
  <g id="console-window">
    <rect class="tile" x="24" y="24" width="420" height="434" rx="12" filter="url(#shadow)" />
    <path d="M24 36 a12 12 0 0 1 12 -12 H432 a12 12 0 0 1 12 12 V58 H24 Z" fill="#FAFAFA" />
    <line x1="24" y1="58" x2="444" y2="58" stroke="#E4E4E7" />
    <circle cx="42" cy="41" r="4" fill="#E4E4E7" />
    <circle cx="56" cy="41" r="4" fill="#E4E4E7" />
    <circle cx="70" cy="41" r="4" fill="#E4E4E7" />
    <text class="note" x="94" y="45.5">AWS console · CloudFormation (simplified)</text>
  </g>
  <g id="account-and-region">
    <rect x="25" y="58" width="418" height="44" fill="#FFFFFF" />
    <line x1="24" y1="102" x2="444" y2="102" stroke="#E4E4E7" />
    <rect x="304.08" y="68" width="123.92" height="24" rx="6" style="fill:#FFFFFF;stroke:#2563EB;stroke-width:1.5" />
    <text class="note" x="314.08" y="84" style="fill:#111111">Europe (Ireland)</text>
    <rect x="175.28" y="68" width="120.8" height="24" rx="6" style="fill:#FFFFFF;stroke:#2563EB;stroke-width:1.5" />
    <text class="mono-dark" x="185.28" y="84">1234-5678-9012</text>
    <circle cx="474" cy="80" r="10" fill="#2563EB" />
    <text class="num" x="474" y="84" text-anchor="middle">1</text>
  </g>
    <text class="heading" x="44" y="128">Quick create stack</text>
  <g id="stack-name">
    <text class="label" x="44" y="158">Stack name</text>
    <rect x="44" y="166" width="380" height="30" rx="6" style="fill:#FAFAFA;stroke:#D4D4D8" />
    <text class="mono-dark" x="54" y="185.5">deployz-bootstrap-…</text>
    <circle cx="474" cy="181" r="10" fill="#2563EB" />
    <text class="num" x="474" y="185" text-anchor="middle">2</text>
  </g>
  <g id="parameters">
    <text class="label" x="44" y="220">Parameters</text>
    <line x1="44" y1="258" x2="424" y2="258" stroke="#F4F4F5" />
    <text class="mono-dark" x="44" y="249">ControlPlaneUrl</text>
    <text class="mono" x="424" y="249" text-anchor="end">prefilled</text>
    <line x1="44" y1="288" x2="424" y2="288" stroke="#F4F4F5" />
    <text class="mono-dark" x="44" y="279">EnrollmentCode</text>
    <text class="mono" x="424" y="279" text-anchor="end">prefilled</text>
    <line x1="44" y1="318" x2="424" y2="318" stroke="#F4F4F5" />
    <text class="mono-dark" x="44" y="309">RelayCredential</text>
    <text class="mono" x="424" y="309" text-anchor="end">****</text>
  </g>
  <g id="capabilities">
    <text class="label" x="44" y="342">Capabilities</text>
    <rect x="44" y="352" width="380" height="54" rx="8" style="fill:#EFF6FF;stroke:#BFDBFE" />
    <rect x="56" y="362" width="16" height="16" rx="4" style="fill:#2563EB" />
    <use href="#i-check" class="icon" x="58" y="364" width="12" height="12" style="stroke:#FFFFFF;stroke-width:3" />
    <text class="body" x="82" y="375">I acknowledge that AWS CloudFormation might create</text>
    <text class="body" x="82" y="393">IAM resources.</text>
    <circle cx="474" cy="370" r="10" fill="#2563EB" />
    <text class="num" x="474" y="374" text-anchor="middle">3</text>
  </g>
  <g id="create-stack">
    <rect x="311.76" y="406" width="112.24" height="32" rx="8" style="fill:#111111" />
    <text class="title" x="367.88" y="426.5" text-anchor="middle" style="fill:#FFFFFF">Create stack</text>
    <text class="title" x="301.76" y="426.5" text-anchor="end" style="fill:#52525B">Cancel</text>
    <circle cx="474" cy="422" r="10" fill="#2563EB" />
    <text class="num" x="474" y="426" text-anchor="middle">4</text>
  </g>
  <g id="steps">
    <line x1="450" y1="80" x2="462" y2="80" stroke="#D4D4D8" stroke-dasharray="3 3" />
    <text class="title" x="492" y="76.5">Check the account and Region</text>
    <text class="note" x="492" y="92.5">They must match the install page.</text>
    <line x1="450" y1="181" x2="462" y2="181" stroke="#D4D4D8" stroke-dasharray="3 3" />
    <text class="title" x="492" y="177.5">Leave the defaults</text>
    <text class="note" x="492" y="193.5">The stack name and parameters come</text>
    <text class="note" x="492" y="209.5">from the install link.</text>
    <line x1="450" y1="370" x2="462" y2="370" stroke="#D4D4D8" stroke-dasharray="3 3" />
    <text class="title" x="492" y="366.5">Acknowledge IAM resources</text>
    <text class="note" x="492" y="382.5">The connector stack creates IAM</text>
    <text class="note" x="492" y="398.5">roles.</text>
    <line x1="450" y1="422" x2="462" y2="422" stroke="#D4D4D8" stroke-dasharray="3 3" />
    <text class="title" x="492" y="418.5">Select Create stack</text>
    <text class="note" x="492" y="434.5">This creates the Deployz</text>
    <text class="note" x="492" y="450.5">connector.</text>
  </g>
</svg>
