<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="title desc">
  <title id="title">What removal deletes and keeps</title>
  <desc id="desc">What stays in the customer&#x27;s AWS account after each removal step. Before removal, everything is in place. Step 1, Remove deployment in Deployz, deletes the application containers, the load balancer and most networking, the cache, configuration secret, and log groups, the custom domain, and the certificates. It keeps the database, its credentials, the storage bucket, the network the database uses, and the connector stack. Retained resources keep costing money in AWS. Step 2, Delete retained data, deletes everything retained except the connector stack. Step 3, deleting the connector stack in the AWS console, removes the last part. Delete the connector stack last.</desc>

  <!--
    Deployz docs illustration. Style: deployz-website DESIGN.md section 7 (scene system).
    Tokens: foreground #111111, muted #52525B, subtle #71717A, border #E4E4E7,
    border-strong #D4D4D8, surface #FAFAFA, brand #2563EB, brand-subtle #EFF6FF,
    brand-border #BFDBFE, success #15803D, warning #A16207, error #B91C1C.
    Edit text in place; each part is a named <g>. Mobile variant of removal-steps.svg.
  -->

  <defs>
    <style>
      text { font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 13px; fill: #111111; }
      .label { font-size: 12px; font-weight: 600; fill: #52525B; }
      .note { font-size: 12px; fill: #52525B; }
      .badge { font-size: 12px; font-weight: 500; }
      .num { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #71717A; }
      .mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111111; }
      .mono-brand { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1D4ED8; }
      .boundary { fill: none; stroke: #A1A1AA; stroke-width: 1; stroke-dasharray: 5 4; }
      .tag { fill: #FFFFFF; stroke: #E4E4E7; }
      .band { fill: #FAFAFA; stroke: #E4E4E7; }
      .tile { fill: #FFFFFF; stroke: #E4E4E7; }
      .tile-optional { fill: #FFFFFF; stroke: #A1A1AA; stroke-dasharray: 4 3; }
      .icon-tile { fill: #FAFAFA; stroke: #E4E4E7; }
      .icon { fill: none; stroke: #52525B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #A1A1AA; stroke-width: 1.5; }
      .track-dashed { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .beam { fill: none; stroke: #2563EB; stroke-width: 1.5; }
      .port { fill: #FFFFFF; stroke: #A1A1AA; stroke-width: 1.5; }
      .port-brand { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
    </style>

    <!-- Stage: dot grid that fades to the edges, one faint cobalt light -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#D4D4D8" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="360" height="640" fill="url(#fade)" />
    </mask>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Card depth -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111111" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-brand" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#111111" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.14" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>



    <!-- Icons: Lucide (ISC license), 24 x 24 -->
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></symbol>
  </defs>
  <g id="stage">
    <rect x="0.5" y="0.5" width="359" height="639" rx="16" fill="#FFFFFF" stroke="#E4E4E7" />
    <rect x="1" y="1" width="358" height="638" rx="16" fill="url(#dots)" mask="url(#fade-mask)" opacity="0.7" />
  </g>
  <g id="columns">
    <text class="label" x="210" y="42" text-anchor="middle">Now</text>
    <circle cx="246" cy="38" r="10" fill="#2563EB" />
    <text class="num" x="246" y="42" text-anchor="middle">1</text>
    <circle cx="282" cy="38" r="10" fill="#2563EB" />
    <text class="num" x="282" y="42" text-anchor="middle">2</text>
    <circle cx="318" cy="38" r="10" fill="#2563EB" />
    <text class="num" x="318" y="42" text-anchor="middle">3</text>
  </g>
  <g id="resources">
    <rect class="tile" x="8" y="58" width="344" height="352" rx="12" filter="url(#shadow)" />
    <text class="body" x="20" y="85">Application containers</text>
    <circle cx="210" cy="81.0" r="6" fill="#52525B" />
    <circle cx="246" cy="81.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <circle cx="282" cy="81.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <circle cx="318" cy="81.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <line x1="20" y1="98" x2="340" y2="98" stroke="#F4F4F5" />
    <text class="note" x="20" y="112" style="fill:#111111">Load balancer and most</text>
    <text class="note" x="20" y="127" style="fill:#111111">networking</text>
    <circle cx="210" cy="115.0" r="6" fill="#52525B" />
    <circle cx="246" cy="115.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <circle cx="282" cy="115.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <circle cx="318" cy="115.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <line x1="20" y1="132" x2="340" y2="132" stroke="#F4F4F5" />
    <text class="note" x="20" y="146" style="fill:#111111">Cache, configuration</text>
    <text class="note" x="20" y="161" style="fill:#111111">secret, log groups</text>
    <circle cx="210" cy="149.0" r="6" fill="#52525B" />
    <circle cx="246" cy="149.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <circle cx="282" cy="149.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <circle cx="318" cy="149.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <line x1="20" y1="166" x2="340" y2="166" stroke="#F4F4F5" />
    <text class="body" x="20" y="187">Custom domain</text>
    <circle cx="210" cy="183.0" r="6" fill="#52525B" />
    <circle cx="246" cy="183.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <circle cx="282" cy="183.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <circle cx="318" cy="183.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <line x1="20" y1="200" x2="340" y2="200" stroke="#F4F4F5" />
    <text class="note" x="20" y="214" style="fill:#111111">Database (deletion</text>
    <text class="note" x="20" y="229" style="fill:#111111">protection on)</text>
    <circle cx="210" cy="217.0" r="6" fill="#52525B" />
    <circle cx="246" cy="217.0" r="6" fill="#FDE68A" stroke="#A16207" stroke-width="1.5" />
    <circle cx="282" cy="217.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <circle cx="318" cy="217.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <line x1="20" y1="234" x2="340" y2="234" stroke="#F4F4F5" />
    <text class="body" x="20" y="255">Database credentials</text>
    <circle cx="210" cy="251.0" r="6" fill="#52525B" />
    <circle cx="246" cy="251.0" r="6" fill="#FDE68A" stroke="#A16207" stroke-width="1.5" />
    <circle cx="282" cy="251.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <circle cx="318" cy="251.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <line x1="20" y1="268" x2="340" y2="268" stroke="#F4F4F5" />
    <text class="body" x="20" y="289">Storage bucket and files</text>
    <circle cx="210" cy="285.0" r="6" fill="#52525B" />
    <circle cx="246" cy="285.0" r="6" fill="#FDE68A" stroke="#A16207" stroke-width="1.5" />
    <circle cx="282" cy="285.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <circle cx="318" cy="285.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <line x1="20" y1="302" x2="340" y2="302" stroke="#F4F4F5" />
    <text class="body" x="20" y="323">Certificates</text>
    <circle cx="210" cy="319.0" r="6" fill="#52525B" />
    <circle cx="246" cy="319.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <circle cx="282" cy="319.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <circle cx="318" cy="319.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <line x1="20" y1="336" x2="340" y2="336" stroke="#F4F4F5" />
    <text class="note" x="20" y="350" style="fill:#111111">Network the database</text>
    <text class="note" x="20" y="365" style="fill:#111111">uses</text>
    <circle cx="210" cy="353.0" r="6" fill="#52525B" />
    <circle cx="246" cy="353.0" r="6" fill="#FDE68A" stroke="#A16207" stroke-width="1.5" />
    <circle cx="282" cy="353.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <circle cx="318" cy="353.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <line x1="20" y1="370" x2="340" y2="370" stroke="#F4F4F5" />
    <text class="body" x="20" y="391">Deployz connector stack</text>
    <circle cx="210" cy="387.0" r="6" fill="#52525B" />
    <circle cx="246" cy="387.0" r="6" fill="#FDE68A" stroke="#A16207" stroke-width="1.5" />
    <circle cx="282" cy="387.0" r="6" fill="#FDE68A" stroke="#A16207" stroke-width="1.5" />
    <circle cx="318" cy="387.0" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
  </g>
  <g id="cost-note">
    <use href="#i-alert" class="icon" x="18" y="417" width="14" height="14" style="stroke:#A16207" />
    <text class="note" x="40" y="428">Kept resources stay in the customer&#x27;s AWS</text>
    <text class="note" x="40" y="444">account and keep costing money until step 2.</text>
  </g>
  <g id="legend">
    <circle cx="30" cy="478" r="10" fill="#2563EB" />
    <text class="num" x="30" y="482" text-anchor="middle">1</text>
    <text class="body" x="48" y="482">Remove deployment</text>
    <text class="note" x="48" y="498">In Deployz</text>
    <circle cx="30" cy="522" r="10" fill="#2563EB" />
    <text class="num" x="30" y="526" text-anchor="middle">2</text>
    <text class="body" x="48" y="526">Delete retained data</text>
    <text class="note" x="48" y="542">Deployz or AWS console</text>
    <circle cx="30" cy="566" r="10" fill="#2563EB" />
    <text class="num" x="30" y="570" text-anchor="middle">3</text>
    <text class="body" x="48" y="570">Delete the connector stack</text>
    <text class="note" x="48" y="586">AWS console</text>
    <circle cx="30" cy="610" r="6" fill="#52525B" />
    <text class="note" x="42" y="614">In place</text>
    <circle cx="126.96000000000001" cy="610" r="6" fill="#FDE68A" stroke="#A16207" stroke-width="1.5" />
    <text class="note" x="138.96" y="614">Kept</text>
    <circle cx="199.44" cy="610" r="6" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.25" stroke-dasharray="2 2" />
    <text class="note" x="211.44" y="614">Deleted</text>
  </g>
</svg>
